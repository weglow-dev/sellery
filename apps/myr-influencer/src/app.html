<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0b0e" />
		<!-- 로그인 뒤에 쓰는 콘솔이라 검색에 노출하지 않는다. 지금은 ssr=false 라 <svelte:head> 가 JS 실행 뒤에야 붙으므로 정적 HTML 에 둔다.
		     같은 값을 vercel.json 이 X-Robots-Tag 헤더로도 보낸다(이미지·리다이렉트 응답 포함). robots.txt 는 수집을 막지 않는다 — 막으면 이 noindex 를 못 읽는다 -->
		<meta name="robots" content="noindex, nofollow" />
		<meta name="description" content="MYR 크리에이터 콘솔 — 내 제품 등록 · 판매 실적 · 교환/환불 CS 관리" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- 샵·랜딩(apps/myr · apps/myr-shop)과 같은 Pretendard Variable (가변 100~900) -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
