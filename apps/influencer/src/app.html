<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#eef3dc" />
		<!-- 콘솔 전체 비색인 (web (partner)/layout.tsx metadata.robots · docs/inf-console-plan.md §4.9) — routes/robots.txt/+server.ts(disallow /) 와 이중. 데모 그룹도 같은 셸 안이라 그대로 적용된다. -->
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.svg" />
		<!-- 폰트 (docs/monorepo-migration.md 결정 G · apps/shop/src/app.html 과 동일): IBM Plex Sans KR 300–700 · IBM Plex Mono 400/500/700 · Archivo 500–900.
		     콘솔은 Galmuri 를 적재하지 않는다(web 과 동일) — (demo) 그룹 레이아웃이 자기 CSS(theme.css)를 따로 가져온다. 제목은 각 페이지의 <svelte:head> 가 정한다. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@500..900&display=swap" />
		%sveltekit.head%
	</head>
	<!-- body 에 폰트 스무딩 유틸을 붙이지 않는다 (Windows subpixel AA 유지 — CLAUDE.md 타이포 규칙) -->
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
