name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: 프로토타입 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node scripts/check.mjs
        run: node scripts/check.mjs
