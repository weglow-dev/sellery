name: CI

# PR 필수 상태 검사. 브랜치 보호 규칙의 required status check 컨텍스트는
# 아래 job 의 name("프로토타입 점검") 이다 — 이름을 바꾸면 보호 규칙도 같이 바꿀 것.
# 내용(docs/monorepo-migration.md §8.1): 앱 4개 svelte-check + packages/{db,payments} tsc → vitest(순수 규칙) → 패키지 경계 검사(scripts/check-boundaries.mjs)
# → 배포와 같은 빌드(@sveltejs/adapter-vercel → apps/*/.vercel/output).
#
# PUBLIC_* 는 $env/static/public(빌드 시 인라인)이라 check·build 때 이름이 있어야 한다 — 더미 값을 job env 로 준다.
# 원칙: 빌드가 실제 키를 요구하면 설계 위반. 비밀키는 CI 에 넣지 않는다 (docs/monorepo-migration.md 결정 11 · §8.3). 유일한 required check (web-ci.yml 은 S5 PR-11 에서 삭제).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: 프로토타입 점검
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: ci
      PUBLIC_SITE_URL: http://localhost:5176
      PUBLIC_TOSS_CLIENT_KEY: test_gck_ci # S3 apps/shop 체크아웃(결제위젯) — 이름만 있으면 된다 (docs/monorepo-migration.md §8.3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: svelte-check (apps/*) · tsc (packages/db · packages/payments)
        run: npm run check
      - name: vitest (packages/db · packages/payments 순수 규칙)
        run: npm test
      - name: 패키지 경계 검사 (scripts/check-boundaries.mjs)
        run: node scripts/check-boundaries.mjs
      # 번호가 같아도 파일명이 다르면 git 이 충돌로 알려주지 않는다 — 병합 뒤 db push 가 터진다(0043 · 0047 에서 두 번)
      - name: 마이그레이션 번호 검사 (scripts/check-migrations.mjs)
        run: node scripts/check-migrations.mjs
      - name: build (apps/*/.vercel/output)
        run: npm run build

  # 마이그레이션의 RPC · 권한 · 상태 전이를 pgTAP 으로 (docs/testing.md §2). 빈 로컬 Postgres 에 supabase/migrations 전부를 적용한 뒤
  # supabase/tests/*.test.sql 을 돌린다 — 마이그레이션이 빈 DB 에서 순서대로 적용되는지도 같이 검증된다. 비밀키 없음 (로컬 컨테이너 기본값).
  # 브랜치 보호의 required check 는 아직 "프로토타입 점검" 뿐 — 이 job 이 안정되면 추가한다.
  db-test:
    name: DB 테스트 (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 로컬 Postgres 시작 + 마이그레이션 적용
        run: supabase db start
      - name: pgTAP (supabase/tests)
        run: supabase test db --local
