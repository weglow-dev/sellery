        if(m.type==='warn')return `<div class="warnline">${esc(m.txt)}</div>`;
        return `<div class="msg ${m.role}"><div class="who" style="color:${m.role==='admin'?'var(--ink)':`var(--${m.role==='brand'?'brand':'seller'}-c)`}">${m.role==='brand'?b.name:m.role==='admin'?'셀러리 운영팀':s.name}</div>${esc(m.txt)}<div class="tm">${md(P(m.at))}</div></div>`;
      }).join('')||'<div class="sysline">대화가 없습니다</div>'}</div>
      <div class="composer">
        <span class="as">${role==='brand'?'브랜드':role==='admin'?'브랜드(관리자 대행)':'인플루언서'}로 발신</span>
        <input id="chatIn" placeholder="메시지 입력… (시스템 승인·일정은 우측 버튼으로)" data-enter="sendChat">
        <button class="pri" data-act="sendChat" data-k="${cid}">전송</button>
      </div>
    </div>
    <div class="actions">
      ${detActions(c,k,p,s,linkUrl)}
      <div class="card stmtcard">
        <h4>정산 미리보기</h4>
        <table class="stmt" style="min-width:0;font-size:12.5px">
          <tr><td>결제 ${k.paidCnt+k.refCnt}건</td><td class="num">₩${fmt(k.gross)}</td></tr>
          <tr><td>환불 ${k.refCnt}건</td><td class="num">−₩${fmt(k.refund)}</td></tr>
          <tr><td><b>확정 매출</b></td><td class="num"><b>₩${fmt(k.net)}</b></td></tr>
          ${k.sampleNet?`<tr><td>　└ 샘플 구매분 (인플 수수료 0)</td><td class="num">₩${fmt(k.sampleNet)}</td></tr>`:''}
          <tr><td>PG ${(PG_RATE*100).toFixed(1)}%</td><td class="num">−₩${fmt(k.pg)}</td></tr>
          <tr><td>인플루언서 ${(p.rate*100).toFixed(0)}%${k.gBonus?` <b style="color:var(--red)">+${(gradeBonusOf(s)*100).toFixed(1)}%p ${gname(s)}</b>`:''}${k.rb?' <b style="color:var(--red)">+1%p 추천</b>':''}</td><td class="num">−₩${fmt(k.sfTotal)}</td></tr>
          ${k.rb?`<tr><td>추천인 보상 2%</td><td class="num">−₩${fmt(k.refReward)}</td></tr>`:''}
          ${k.bb?`<tr><td>브랜드 추천인 보상 1%</td><td class="num">−₩${fmt(k.bReward)}</td></tr><tr><td>신규 브랜드 수수료 할인 −1%p</td><td class="num" style="color:var(--red)">+₩${fmt(k.bBoost)}</td></tr>`:''}
          ${k.bDisc?`<tr><td>브랜드 ${bgname(b)} 등급 수수료 할인 −${(bDiscOf(b)*100).toFixed(1)}%p</td><td class="num" style="color:var(--red)">+₩${fmt(k.bDisc)}</td></tr>`:''}
          <tr><td>플랫폼 ${(PLAT_RATE*100).toFixed(0)}%${k.costs?' (보너스·보상·할인 차감 후)':''}</td><td class="num">−₩${fmt(k.pf)}</td></tr>
          <tr class="tot"><td>브랜드 정산액</td><td class="num">₩${fmt(k.brandPay)}</td></tr>
        </table>
        ${c.end?`<div style="font-size:11.5px;color:var(--mute);margin-top:8px">정산 기준일(D+${CLEAR_DAYS}): <b>${md(settleDue(c))}</b></div>`:''}
      </div>
    </div>
  </div>`;
}
function detActions(c,k,p,s,linkUrl){
  const A=[];
  const V=S.view.role; // seller | brand | admin — 액션은 해당 역할에게만
  const card=(h,hint,btns)=>`<div class="card"><h4>${h}</h4><p class="hint">${hint}</p><div class="btnrow">${btns}</div></div>`;
  const sim=(h,hint,btns)=>`<div class="sim" style="margin-bottom:12px"><h4>⏱ ${h}</h4><p>${hint}</p><div class="btnrow">${btns}</div></div>`;
  const wait=(t,d)=>card(t+' ⏳',d,'');
  switch(c.status){
    case 'SAMPLE_REQUESTED':
      if(V==='seller') A.push(wait('브랜드 승인 대기 중','샘플 요청이 접수됐어요. 브랜드가 프로필을 검토 중입니다 — 보통 24시간 내 응답해요.'));
      else A.push(card('샘플 요청 검토 <span class="chip brand">브랜드 액션</span>',
        `${platIcon(s)} ${s.name} ${s.handle} · 팔로워 ${fmt(s.followers)} · 등급 ${gname(s)}. 승인 시 배송지가 브랜드에 전달됩니다.`,
        `<button class="pri" data-act="approveSample" data-k="${c.id}">승인</button>
         <button class="danger" data-act="rejectSample" data-k="${c.id}">거절</button>`));
      break;
    case 'INVITED':
      if(V==='seller') A.push(card('브랜드 직접 제안 <span class="chip seller">인플루언서 액션</span>',
        `<b>${esc(brand(p.brandId).name)}</b>가 <b>${esc(p.name)}</b> 판매를 제안했어요 · 수수료 ${(p.rate*100).toFixed(0)}%${gradeBonusOf(s)?` + 등급 보너스 ${(gradeBonusOf(s)*100).toFixed(1)}%p`:''} · 수락 시 샘플 발송 단계부터 시작됩니다 (무상 · 이달 한도 미차감).`,
        `<button class="pri" data-act="acceptInvite" data-k="${c.id}">수락 → 샘플 받기</button>
         <button data-act="declineInvite" data-k="${c.id}">거절</button>`));
      else A.push(wait('인플루언서 수락 대기 중','제안을 보냈어요. 인플루언서가 수락하면 샘플 발송 단계로 넘어갑니다 — 보통 48시간 내 응답해요.'));
      break;
    case 'DECLINED': A.push(card('제안 거절됨','인플루언서가 이번 제안을 수락하지 않았습니다.'+(c.celRefunded?` 제안권 ${CEL} ${c.celRefunded} 환급 완료.`:''),'')); break;
    case 'SAMPLE_PURCHASED':{
      const sp=c.samplePaid||{};const rf=spOf(p).refund;
      if(V==='seller') A.push(wait('결제 완료 · 샘플 발송 준비 중',`샘플 구매 ₩${fmt(sp.price||0)}${sp.cel?` (${CEL} ${sp.cel} + ₩${fmt(sp.cash||0)})`:' (현금)'} — 브랜드가 발송하면 운송장이 표시됩니다.${rf?' 판매 확정 시 구매액이 환급됩니다.':''}`));
      else A.push(card(`샘플 발송 <span class="chip brand">브랜드 액션</span> <span class="st green" style="animation:none">구매 완료 ₩${fmt(sp.price||0)}</span>`,'인플루언서가 샘플을 구매했습니다(승인 불필요). 운송장 번호를 입력하면 배송 추적이 시작됩니다.',
        `<input id="trackIn" placeholder="운송장 번호 (예: 6890-1234-5678)" style="margin-bottom:8px">
         <button class="pri" data-act="shipSample" data-k="${c.id}">발송 처리</button>`));
      break;}
    case 'SAMPLE_APPROVED':
      if(V==='seller') A.push(wait('샘플 발송 준비 중','브랜드가 요청을 승인했어요. 샘플이 발송되면 운송장이 여기 표시됩니다.'));
      else A.push(card('샘플 발송 <span class="chip brand">브랜드 액션</span>','운송장 번호를 입력하면 배송 추적이 시작됩니다.',
        `<input id="trackIn" placeholder="운송장 번호 (예: 6890-1234-5678)" style="margin-bottom:8px">
         <button class="pri" data-act="shipSample" data-k="${c.id}">발송 처리</button>`));
      break;
    case 'SAMPLE_SHIPPED':
      if(V==='brand') A.push(wait('인플루언서 수령 대기 중',`운송장 ${c.tracking||'—'} · 인플루언서가 수령을 확인하면 테스트가 시작됩니다.`));
      else A.push(card('샘플 수령 확인 <span class="chip seller">인플루언서 액션</span>',`운송장 ${c.tracking||'—'} · 수령 확인 시 테스트 기한 14일이 시작됩니다.`,
        `<button class="pri" data-act="receiveSample" data-k="${c.id}">수령 확인</button>`));
      break;
    case 'TESTING':
      if(V==='brand') A.push(wait('인플루언서 테스트 중',`인플루언서가 샘플을 사용해보고 있어요. 기한 ${c.testDue?md(P(c.testDue)):'—'} 까지 진행 여부를 응답합니다.`));
      else A.push(card('테스트 후 진행 결정 <span class="chip seller">인플루언서 액션</span>',
        `기한 ${c.testDue?md(P(c.testDue)):'—'} 까지. 진행 시 판매 일정을 제안합니다.`,
        `<button class="pri" data-act="openSchedule" data-k="${c.id}">진행할게요 → 일정 제안</button>
         <button data-act="passCamp" data-k="${c.id}">이번엔 패스</button>`));
      break;
    case 'SCHEDULE_PROPOSED':
      if(V==='seller') A.push(wait('브랜드 일정 승인 대기',`제안한 기간 <b>${md(P(c.propStart))} – ${md(P(c.propEnd))}</b> · 재고 ${fmt(c.propQty)}개를 브랜드가 검토 중이에요.`));
      else A.push(card('일정 승인 <span class="chip brand">브랜드 액션</span>',
        `제안 기간: <b>${md(P(c.propStart))} – ${md(P(c.propEnd))}</b> · 배정 재고 ${fmt(c.propQty)}개. 승인하면 이 기간이 캘린더에 표시됩니다(플래티넘 이상이 잡은 기간은 상위 등급만 추가 진입).`,
        `<button class="pri" data-act="confirmSchedule" data-k="${c.id}">일정 승인</button>
         <button class="danger" data-act="rejectSchedule" data-k="${c.id}">반려 (재제안 요청)</button>`));
      break;
    case 'SCHEDULE_CONFIRMED':{
      const dday=Math.ceil((P(c.start)-today())/DAY);
      A.push(card('판매 대기 중',`시작 ${md(P(c.start))} (D-${Math.max(dday,0)}) — 시작 시각에 링크가 자동 활성화됩니다.`,''));
      if(V==='admin') A.push(sim('시뮬레이션','실서비스에선 스케줄러가 자동 처리합니다.',
        `<button class="sm" data-act="goLive" data-k="${c.id}">판매 시작 처리</button>`));
      break;}
    case 'LIVE':
      A.push(card('판매 링크 <span class="st live"><span class="pulse"></span>LIVE</span>',
        `<code style="font-size:11.5px">${linkUrl}</code> · 종료 ${md(P(c.end))}`,
        `<button class="pri" data-act="preview" data-k="${c.id}">판매 페이지 미리보기</button>
         <button data-act="copyLink" data-k="${linkUrl}">링크 복사</button>`));
      if(V==='admin') A.push(sim('판매 시뮬레이션','구매자 주문을 흉내내 정산 숫자가 움직이는 걸 확인하세요.',
        `<button class="sm" data-act="simOrders" data-k="${c.id}">주문 +5건</button>
         <button class="sm" data-act="simOrders20" data-k="${c.id}">주문 +20건</button>
         <button class="sm" data-act="endCamp" data-k="${c.id}">판매 종료 처리</button>`));
      break;
    case 'CLEARING':{
      const due=settleDue(c);
      A.push(card('교환·환불 처리 기간',
        `종료 ${md(P(c.end))} → 정산 기준일 <b>${md(due)}</b> (D+${CLEAR_DAYS}). 이 기간의 환불은 정산액에서 차감됩니다.`,''));
      if(V==='admin') A.push(sim('시뮬레이션','',`<button class="sm" data-act="ffwd" data-k="${c.id}">⏩ 3주 경과 처리</button>`));
      break;}
    case 'SETTLED':
      A.push(card('정산 완료 ✓',`인플루언서 지급 ₩${fmt(k.sfTotal*(1-sellerWht(s)))}${sellerWht(s)?' (원천징수 3.3% 후)':' (사업자 · 세금계산서)'} · 브랜드 지급 ₩${fmt(k.brandPay)}. 성과가 좋았다면 같은 조합으로 바로 재판매를 열 수 있습니다.`,
        `${V!=='brand'?`<button class="pri" data-act="regongu" data-k="${c.id}">🔁 재판매 제안 (샘플 생략)</button>`:''}
         <button data-act="settleCSV">명세 CSV</button>`));
      break;
    case 'REJECTED': A.push(card('거절된 요청','브랜드가 이번 요청을 승인하지 않았습니다.','')); break;
    case 'PASSED': A.push(card('인플루언서 패스','인플루언서가 테스트 후 진행하지 않기로 했습니다.','')); break;
  }
  return A.join('');
}

/* ============ modals ============ */
function openModal(html){$('#modalroot').innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;}
function closeModal(){$('#modalroot').innerHTML='';}
function scheduleModal(cid){
  const c=camp(cid),p=prod(c.productId);
  const slots=D_().campaigns.filter(x=>x.productId===p.id&&['SCHEDULE_CONFIRMED','LIVE'].includes(x.status));
  openModal(`<h3>판매 일정 제안 — ${esc(p.name)}</h3>
  <div class="fld"><label>이 상품의 확정 기간 — ${gfull(PRIORITY_TIER).replace(/<[^>]+>/g,'').trim()} 이상이 잡은 기간은 상위 등급만 진입 가능</label>
    <div class="slots">${slots.map(x=>`<div class="slot"><span class="rng">${md(P(x.start))} – ${md(P(x.end))}</span><span>${seller(x.sellerId).handle} 확정</span></div>`).join('')||'<div class="slot">아직 확정된 기간 없음</div>'}</div></div>
  <div class="fld"><label>시작일</label><input type="date" id="schStart" value="${ymd(addD(today(),7))}" min="${ymd(addD(today(),1))}"></div>
  <div class="fld"><label>기간</label><select id="schLen"><option value="3">3일</option><option value="5" selected>5일</option><option value="7">7일</option></select></div>
  <div class="fld"><label>희망 배정 재고 <span style="font-weight:400">— 배정 가능 ${fmt(stockLeft(p,cid))}개</span></label><input type="number" id="schQty" value="${Math.min(500,stockLeft(p,cid))}" min="50" step="50" max="${stockLeft(p,cid)}"></div>
  <div class="foot"><button data-act="closeModal">취소</button><button class="pri" data-act="proposeSchedule" data-k="${cid}">승인 요청 보내기</button></div>`);
}
function sampleBuyModal(pid){
  const p=prod(pid),me=seller(S.actingSeller),b=brand(p.brandId),sp=spOf(p),pr=samplePrice(p),sl=sampleSplit(pr),bal=celBal(S.actingSeller);
  const canCel=sl.cel>0&&bal>=sl.cel;
  openModal(`<h3>샘플 구매 — ${pIcon(p,26)} ${esc(p.name)}</h3>
  <div style="font-size:12.5px;color:var(--mute);margin:-8px 0 12px">${esc(b.name)} · 무상 기준 <span class="gradebox sm">${gfull(sp.freeGrade)}</span> 이상 · 내 등급 <span class="gradebox sm">${gfull(gname(me))}</span></div>
  <table class="stmt" style="min-width:0;font-size:13px">
    ${sp.buyMode==='fixed'?`<tr><td>브랜드 지정 샘플가 (1회 한정)</td><td class="num"><b>₩${fmt(pr)}</b></td></tr>`
    :`<tr><td>판매가</td><td class="num">₩${fmt(p.gp)}</td></tr><tr><td>− 내 수수료 ${(p.rate*100).toFixed(0)}%</td><td class="num">−₩${fmt(p.gp-pr)}</td></tr><tr class="tot"><td>샘플 구매가</td><td class="num">₩${fmt(pr)}</td></tr>`}
  </table>
  <div class="lbl-sm" style="margin:14px 0 6px">결제 수단</div>
  <label class="opt ${canCel?'':'on'}" style="display:flex;gap:10px"><input type="radio" name="spay" value="cash" ${canCel?'':'checked'}> <span>현금 결제 (셀러리 안전결제)</span><b>₩${fmt(pr)}</b></label>
  <label class="opt ${canCel?'on':''}" style="display:flex;gap:10px;${sl.cel?'':'opacity:.5'}"><input type="radio" name="spay" value="cel" ${canCel?'checked':'disabled'}> <span>셀러리 우선 결제 <span style="color:var(--mute)">(1${CEL} = ₩${fmt(SAMPLE_CEL_WON)} · 보유 ${CEL} ${bal})</span></span><b>${sl.cel?`${CEL} ${sl.cel}${sl.cash?' + ₩'+fmt(sl.cash):''}`:'해당 없음'}</b></label>
  ${sl.cel&&!canCel?`<div style="font-size:12px;color:var(--danger);margin-top:6px">셀러리 ${sl.cel}개가 필요해요 (보유 ${bal}) — <span data-act="shopGo" style="text-decoration:underline;cursor:pointer">셀러리 샵에서 충전</span></div>`:''}
  <p style="font-size:12px;color:var(--mute);margin-top:12px">구매 샘플은 브랜드 승인 없이 바로 발송 단계로 넘어가고, 이달 무상 한도를 쓰지 않습니다. 브랜드는 일반 판매 1건과 동일하게 정산받습니다(플랫폼 수수료 10% 동일).${sp.refund?' <b>이 상품은 판매 확정 시 샘플 구매액을 환급합니다.</b>':''}</p>
  <div class="foot"><button data-act="closeModal">취소</button><button class="pri" data-act="confirmSampleBuy" data-k="${pid}">결제하고 샘플 받기</button></div>`);
}
/* 인플루언서 프로필 모달 — 갤러리 카드(데이터 게이트 포함) 그대로 */
function sellerProfileModal(sid){
  const sl=seller(sid);if(!sl)return;S.profileOpen=sid;
  openModal(`<h3 style="display:flex;align-items:center;gap:8px">인플루언서 프로필 <span class="st gray" style="animation:none">${sl.hidden?'비공개':'공개'}</span></h3>
  <div class="profile-wrap">${sellerCard(sl,'')}</div>
  <div class="foot"><button data-act="closeModal">닫기</button></div>`);
}
function inviteModal(sid){
  const s=seller(sid);
  const disp=s.hidden?'○○○ 인플루언서 (익명)':s.name+' '+s.handle;
  const myP=D_().products.filter(p=>p.brandId===S.actingBrand&&p.status==='listed');
  if(!myP.length){toast('노출 중인 상품이 없습니다 — 상품을 먼저 등록하세요');return;}

function fileToDataURL(file,maxW,cb){
  const img=new Image();
  img.onload=()=>{
    const sc=Math.min(1,maxW/img.width);
    const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.8));
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(file);
}

      inp.addEventListener('change',()=>{
        const f=inp.files[0];if(!f)return;
        const rd=new FileReader();
        rd.onload=()=>{
          const lines=String(rd.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
          let n=0;
          lines.forEach(ln=>{

            const o=D_().orders.find(x=>x.id.toUpperCase()===cells[0].toUpperCase());
            if(o&&o.status==='PAID'){o.tracking=cells[1];n++;}
          });
          save();render();
          toast(n?`✓ 송장 ${n}건 적용 완료 — 배송중 처리`:'매칭된 주문이 없습니다 — 주문번호 열을 확인하세요');

        inp.value='';
      });

  runSettle(cid){
    const c=camp(cid),k=calc(c),p=prod(c.productId),sl=seller(c.sellerId);
    c.status='SETTLED';c.settledAt=ymd(today());
    if(+c.id.slice(1)>=100)sl.m3Sales=(sl.m3Sales||0)+k.net;   // 시드 이후 생성된 판매만 3개월 매출(등급·셀러리 획득 기준)에 누적
    let refundCash=0;
    if(c.samplePaid&&spOf(p).refund&&!c.sampleRefunded){const sp=c.samplePaid;if(sp.cel)(D_().celeryLedger=D_().celeryLedger||[]).push({who:c.sellerId,at:ymd(today()),delta:sp.cel,memo:`샘플 구매 환급 · ${p.name}`});refundCash=sp.cash||0;c.sampleRefunded=true;pushSys(cid,`🎁 샘플 구매액 환급 — ${sp.cel?`${CEL} ${sp.cel}`:''}${sp.cel&&refundCash?' + ':''}${refundCash?'₩'+fmt(refundCash):''} (판매 확정 조건 충족)`);}
    const bz=brand(p.brandId);const holdS=!(sl.settleInfo&&sl.settleInfo.account),holdB=!(bz.settleInfo&&bz.settleInfo.account);
    D_().settlements.push({at:ymd(today()),cid,title:`${p.name} · ${sl.handle}`,net:k.net,brandPay:k.brandPay,sellerPay:k.sfTotal*(1-sellerWht(sl))+refundCash,platFee:k.pf,pfNet:k.pfNet,holdS,holdB});
    if(holdS||holdB)pushSys(cid,`⏸ 지급 보류 — ${[holdS?'인플루언서':'',holdB?'브랜드':''].filter(Boolean).join('·')} 정산 계좌 미등록. 마이페이지에서 정산 정보를 등록하면 다음 지급 배치에 포함됩니다.`);
    if(k.refReward>0){
      const refId=seller(c.sellerId).referredBy;
      (D_().refEarnings=D_().refEarnings||[]).push({at:ymd(today()),referrerId:refId,fromSellerId:c.sellerId,campaignId:cid,amt:k.refReward});
      pushSys(cid,`추천 보상 지급 — 추천인 ${seller(refId).name}에게 확정 매출의 2% ₩${fmt(k.refReward)} (플랫폼 부담)`);
    }
    if(k.bReward>0){
      const rb=brand(p.brandId).referredBy;
      (D_().brandRefEarnings=D_().brandRefEarnings||[]).push({at:ymd(today()),referrerId:rb,fromBrandId:p.brandId,campaignId:cid,amt:k.bReward});
      pushSys(cid,`브랜드 추천 보상 — 추천 브랜드 ${brand(rb).name}에게 확정 매출의 1% ₩${fmt(k.bReward)} · 신규 브랜드 수수료 −1%p 적용 (플랫폼 부담)`);
    }
    pushSys(cid,`<b>정산 완료</b> · 브랜드 ₩${fmt(k.brandPay)}${k.bb?' (추천 할인 −1%p 포함)':''}${k.bDisc?' (등급 할인 포함)':''} · 인플루언서 ₩${fmt(k.sfTotal)}${k.gBonus?` (${gname(sl)} 보너스 포함)`:''}${k.rb?' (추천 부스트 +1%p 포함)':''} → ${sellerWht(sl)?`원천징수 3.3% 공제 후 ₩${fmt(k.sfTotal*(1-WHT))}`:'사업자 정산(세금계산서) ₩'+fmt(k.sfTotal)} · 명세 발행`);
    save();render();toast('정산 실행 완료 — 양측 지급 및 명세 발행');
  },

  saveProduct(pid){
    const p=prod(pid);if(!p)return;
    const nm=$('#npName').value.trim();if(!nm){toast('상품명을 입력하세요');return;}
    const locked=D_().campaigns.some(c=>c.productId===pid&&['SCHEDULE_CONFIRMED','LIVE','CLEARING'].includes(c.status));
    const exg=$('#npExcl').value;
    p.name=nm;p.desc=$('#npDesc').value.trim()||'—';p.cat=$('#npCat').value||p.cat;
    if(NP.thumb)p.thumb=NP.thumb;
    if(NP.imgs&&NP.imgs.length)p.imgs=NP.imgs.slice(0,4);
    p.stock=+$('#npStock').value||0;p.sample=$('#npSample').value||p.sample;
    p.options=$('#npOpts').value.split(/\n/).map(l=>l.split('|')).filter(a=>a.length>=2&&a[0].trim()&&+a[1].replace(/[^\d]/g,'')).map(a=>({n:a[0].trim(),price:+a[1].replace(/[^\d]/g,'')}));
    p.samplePolicy={freeGrade:$('#npFreeGrade').value||'실버',buyMode:$('#npBuyMode').value||'auto',fixedPrice:+$('#npFixed').value||0,refund:!!($('#npRefund')&&$('#npRefund').checked)};
    if(exg)p.exclusive={grade:exg,label:$('#npExclLabel').value.trim()||exg+' 등급 독점권'};else if(!p.exclusiveSellerId)delete p.exclusive;
    if(!locked){const cp=+$('#npCp').value||p.cp,gp=+$('#npGp').value||p.gp,rate=Math.max(5,(+$('#npRate').value||30)-PLAT_RATE*100)/100;
      const priceChanged=(gp!==p.gp||rate!==p.rate);p.cp=cp;p.gp=gp;p.rate=rate;
      if(priceChanged&&p.status==='listed'){p.status='pending';toast('판매가·수수료율 변경 — 재검수 대기로 전환됩니다');}}
    if(p.status==='rejected'){p.status='pending';delete p.rejectReason;}
    NP={thumb:null,imgs:[]};closeModal();save();render();toast(p.status==='pending'?`${p.name} 수정 저장 — 재검수 요청됨`:`${p.name} 수정 저장 완료`);

    <p style="font-size:12px;color:var(--mute);margin-top:10px">주문 조회는 셀러리 고객센터(카카오 로그인)에서, 배송·교환·반품 문의는 아래 버튼으로 공급 브랜드에 바로 전달됩니다. 실서비스에서는 이 단계에서 PG 결제창이 열립니다.</p>
    <div class="foot"><button data-act="openCS" data-k="${cid}|${id}">문의하기</button><button class="pri" data-act="closeModal">확인</button></div>`);
  },
  openCS(k){const [cid,oid]=String(k).split('|');csModal(cid,oid||'');},
  submitCS(cid){
    const type=$('#csType').value, msg=$('#csMsg').value.trim(), oid=$('#csOrder').value.trim();
    if(!msg){toast('문의 내용을 입력해주세요');return;}
    const c=camp(cid),p=prod(c.productId),b=brand(p.brandId);
    const id='cs'+(D_().seq++);
    csList().push({id,cid,orderId:oid||null,buyer:'고객',type,msg,status:'OPEN',at:ymd(today())});
    pushSys(cid,`💬 구매 고객이 <b>${esc(type)}</b> 문의를 남겼습니다 — <b>${esc(b.name)}</b> 고객 문의함으로 전달되었습니다`);
    closeModal();save();render();
    toast(`문의가 ${b.name}에 접수되었습니다 — 답변은 알림톡으로 안내됩니다`);
  },
  csReply(id){
    const x=csList().find(v=>v.id===id);if(!x)return;
    const c=camp(x.cid),p=c&&prod(c.productId);
    openModal(`<h3>고객 문의 답변 — ${esc(x.type)}</h3>
    <div class="sub" style="color:var(--mute);font-size:12.5px;margin:-6px 0 12px">${p?esc(p.name):''} · 주문 ${x.orderId?esc(x.orderId.toUpperCase()):'—'} · ${md(P(x.at))}</div>
    <div style="font-size:13px;background:var(--surface-2);border:1.5px solid var(--soft-line);padding:10px 12px;margin-bottom:13px">${esc(x.msg)}</div>
    <div class="fld"><label>답변</label><textarea id="csRep" rows="4" placeholder="처리 방법과 일정을 안내해주세요">${x.reply?esc(x.reply):''}</textarea></div>
    <div class="foot"><button data-act="closeModal">취소</button><button class="pri" data-act="saveCSReply" data-k="${id}">답변 보내기</button></div>`);
  },
  saveCSReply(id){
    const x=csList().find(v=>v.id===id);if(!x)return;
    const t=$('#csRep').value.trim();if(!t){toast('답변 내용을 입력해주세요');return;}
    x.reply=t;x.repliedAt=ymd(today());x.status='ANSWERED';
    pushSys(x.cid,`💬 브랜드가 고객 문의에 답변했습니다 (${esc(x.type)})`);
    closeModal();save();render();toast('답변 전송 — 고객에게 알림톡으로 안내됩니다');
  },
  csClose(id){const x=csList().find(v=>v.id===id);if(!x)return;x.status='CLOSED';save();render();toast('처리 종료로 변경했습니다');},
  verifyStore(cid){
    const c=camp(cid),p=prod(c.productId),s=seller(c.sellerId),b=brand(p.brandId);
    const ch=(s.channels||[]).filter(x=>x.verified);
    openModal(`<h3>${CEL} 셀러리 판매 인증</h3>
    <div class="notice" style="margin:8px 0 12px">이 판매 페이지는 셀러리가 발급한 정식 링크입니다. 사칭 링크는 이 인증 정보를 표시할 수 없습니다.</div>
    <table class="stmt" style="min-width:0;font-size:13px">
      <tr><td>인증 링크</td><td class="num">sellery.co.kr/s/${s.handle.slice(1)}/${cid} <span class="st green" style="animation:none">유효</span></td></tr>
      <tr><td>판매 인플루언서</td><td class="num">${platIcon(s)} ${esc(s.name)} ${s.handle} · <span class="gradebox sm">${gfull(gname(s))}</span></td></tr>
      <tr><td>인증 채널</td><td class="num">${ch.map(x=>`${PLAT_ICONS[x.platform]||''} ${esc(x.handle)} ✓`).join('<br>')||'—'}</td></tr>
      <tr><td>공급 브랜드</td><td class="num">${esc(b.name)} · <span class="gradebox sm">${gfull(bgname(b))}</span>${b.settleInfo&&b.settleInfo.bizNo?` · 사업자 ${esc(b.settleInfo.bizNo)}`:' · 인증 브랜드'}</td></tr>
      <tr><td>판매 기간</td><td class="num">${c.start?md(P(c.start))+' – '+md(P(c.end)):'—'}</td></tr>
      <tr><td>결제·정산</td><td class="num">셀러리 에스크로 보관 · 종료 후 ${CLEAR_DAYS}일 환불 보호</td></tr>
    </table>
    <div class="foot"><button class="pri" data-act="closeModal">닫기</button></div>`);
  },
  custSeller(sid){S.custSel=sid;S.view={role:S.view.role==='customer'?'customer':S.view.role,screen:'home',cid:null,store:null};if(S.view.role!=='customer'){S.view.role='customer';S.lockedRole=S.lockedRole;}render();},
  custAll(){S.custSel=null;render();},
  custCat(k){S.custCat=k;render();},
  faqToggle(i){S.faqOpen=S.faqOpen===+i?null:+i;render();},
  custJoin(){toast('카카오 로그인 가입은 실서비스에서 제공됩니다 (시뮬레이션)');},
  goCenter(role){S.lockedRole=false;S.view={role,screen:'home',cid:null,store:null};render();},
  notifyMe(){toast('오픈 알림 신청 완료 — 판매 시작 시 카카오 알림톡으로 안내 (시뮬레이션)');},
  /* ---- 관리자: 자동 제안 ---- */
  saveOpex(){const o={};Object.keys(OPEX_DEF).forEach(k=>{const el=$('#ox_'+k);o[k]=el?Math.max(0,+el.value||0):OPEX_DEF[k];});D_().opex=o;save();render();toast('운영 비용 저장 — 순이익 재계산');},
  resetOpex(){delete D_().opex;save();render();toast('운영 비용 기본값으로 복원');},
  admPQLive(v){S.admPQ=v;clearTimeout(S._pq);S._pq=setTimeout(()=>{const el=$('#admPQ');const pos=el?el.selectionStart:0;render();const n=$('#admPQ');if(n){n.focus();n.setSelectionRange(pos,pos);}},200);},
  admPQClear(){S.admPQ='';render();},
  admIQLive(v){S.admIQ=v;clearTimeout(S._iq);S._iq=setTimeout(()=>{const el=$('#admIQ');const pos=el?el.selectionStart:0;render();const n=$('#admIQ');if(n){n.focus();n.setSelectionRange(pos,pos);}},200);},
  admIQClear(){S.admIQ='';render();},
  bcF(k){S.bcF=k;render();},
  admPS(k){S.admPS=k;render();}, admPB(k){S.admPB=k;render();}, admPC(k){S.admPC=k;render();},
  admIG(k){S.admIG=k;render();}, admOF(k){S.admOF=k;render();}, admCF(k){S.admCF=k;S.view.screen='home';render();},
  admGo(k){const [scr,f]=k.split('|');if(scr==='products'&&f)S.admPS=f;if(scr==='orders'&&f)S.admOF=f;S.view={role:'admin',screen:scr,cid:null,store:null};render();},
  admBrandProducts(bid){S.admPB=bid;S.admPS='all';S.view={role:'admin',screen:'products',cid:null,store:null};render();},
  admToggleHidden(sid){const x=seller(sid);x.hidden=!x.hidden;save();render();toast(`${x.name} ${x.hidden?'비공개':'공개'} 전환`);},
  admGrant(who){(D_().celeryLedger=D_().celeryLedger||[]).push({who,at:ymd(today()),delta:3,memo:'관리자 이벤트 지급'});save();render();toast('🥬 3 지급 완료');},
  runSettleAll(){const list=D_().campaigns.filter(c=>c.status==='CLEARING'&&settleDue(c)<=today());list.forEach(c=>ACT.runSettle(c.id));toast(`일괄 정산 ${list.length}건 완료`);},
  toggleReq(){const n=S.view.role==='brand'?brandPending().n:sellerPending().n;const isOpen=n?(S.reqOpen!==false):(S.reqOpen===true);S.reqOpen=!isOpen;render();},
  dmSearch(){S.dmQ=($('#dmQ')||{}).value||'';render();},
  dmSearchLive(v){S.dmQ=v;clearTimeout(S._dmT);S._dmT=setTimeout(()=>{const el=$('#dmQ');const pos=el?el.selectionStart:0;render();const n=$('#dmQ');if(n){n.focus();n.setSelectionRange(pos,pos);}},220);},
  dmClear(){S.dmQ='';render();},
  brandGradeModal(){const b=brand(S.actingBrand);openModal(`<h3>브랜드 등급 · 혜택</h3>${brandGradeHtml(b).replace('<div class="sec">','<div class="lbl-sm" style="margin:6px 0 10px">')}<div class="foot"><button class="pri" data-act="closeModal">닫기</button></div>`);},
  toggleAutoPropose(bid){const b=brand(bid);b.autoPropose=!b.autoPropose;save();render();toast(`${b.name} 자동 제안 ${b.autoPropose?'ON':'OFF'}`);},
  runAutoPropose(){
    const list=autoMatches().slice(0,5);let n=0,skip=0;
    list.forEach(({b,p,s})=>{
      const tg=gname(s);
      if((tg==='다이아'||tg==='블랙')&&celBal(b.id)<10){skip++;return;}
      const celUsed=(tg==='다이아'||tg==='블랙')?10:0;
      if(celUsed)celSpend(b.id,10,`${tg} 인플루언서 자동 제안 · ${p.name}`);
      const id='c'+(D_().seq++);
      D_().campaigns.push({id,sellerId:s.id,productId:p.id,status:'INVITED',createdAt:ymd(today()),invited:true,auto:true,celUsed});
      pushSys(id,`🤖 <b>셀러리 자동 제안</b> — 트렌드·카테고리 적합도 기반으로 <b>${esc(b.name)}</b>가 <b>${esc(p.name)}</b> 판매를 제안했습니다 · 인플루언서 수락 대기`);
      n++;
    });
    save();render();toast(`자동 제안 ${n}건 발송${skip?` · ${skip}건은 브랜드 셀러리 부족으로 보류`:''}`);
  },
  copyLink(url){
    try{navigator.clipboard.writeText('https://'+url);toast('링크 복사됨');}catch(e){toast('복사 실패 — 수동으로 복사해주세요');}
  },
  sendChat(cid){
    const inp=$('#chatIn');const t=inp.value.trim();if(!t)return;
    pushChat(cid,S.view.role==='seller'?'seller':'brand',t);   // 관리자는 브랜드 대행으로 발신 (사용자 결정)
    save();render();
  }
};
function simSell(cid,n){
  const c=camp(cid),p=prod(c.productId);
  const names=['김*은','이*아','박*희','최*진','정*수','한*별','윤*서','장*미'];
  for(let i=0;i<n;i++){
    D_().orders.push({id:'o'+(D_().seq++),campaignId:cid,buyer:names[Math.floor(Math.random()*8)],
      qty:Math.random()<.25?2:1,unit:p.gp,status:'PAID',at:ymd(today())});
  }
  save();render();toast(`주문 ${n}건 발생 (시뮬레이션)`);
}

/* ============ boot screen (session first load, skin flavor) ============ */
(function boot(){
  try{if(sessionStorage.getItem('slry-boot'))return;sessionStorage.setItem('slry-boot','1');}catch(e){}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const o=document.createElement('div');o.className='boot';
  o.innerHTML=`<div class="boot-win"><div class="boot-bar">◼ ◼ ◼<span>SELLERY.EXE</span></div><div class="boot-logo">${LOGO_ICON.replace('class="celogo"','class="celogo" width="52" height="60" style="vertical-align:-14px;margin-right:12px"')}SELLERY<span>.</span></div><div class="boot-txt">LOADING INFLUENCER COMMERCE OS…</div><div class="boot-prog"><i></i></div></div>`;
  document.body.appendChild(o);
  setTimeout(()=>o.classList.add('out'),1350);setTimeout(()=>o.remove(),1750);
})();
/* ============ events ============ */
/* 3D 틸트: 상품 누끼가 마우스를 따라 살짝 기울어짐 (+ 그림자 반대 방향 이동) */
(function(){
  const MAX=11;
  function reset(t){t.style.transform='';t.style.filter='';}
  document.addEventListener('mousemove',e=>{
    const host=e.target.closest&&e.target.closest('.ph, .store-hero');
    if(!host){return;}
    const t=host.querySelector('.p3d');if(!t)return;
    const r=host.getBoundingClientRect();
    const dx=((e.clientX-r.left)/r.width-0.5)*2, dy=((e.clientY-r.top)/r.height-0.5)*2;
    t.style.transform=`perspective(700px) rotateX(${(-dy*MAX).toFixed(2)}deg) rotateY(${(dx*MAX).toFixed(2)}deg) translateZ(14px) scale(1.05)`;
    t.style.filter=`drop-shadow(${(-dx*10).toFixed(1)}px ${(10-dy*6).toFixed(1)}px 8px rgba(28,42,20,.22))`;
    host.classList.add('tilting');
  });
  document.addEventListener('mouseout',e=>{
    const host=e.target.closest&&e.target.closest('.ph, .store-hero');
    if(!host||host.contains(e.relatedTarget))return;
    const t=host.querySelector('.p3d');if(t)reset(t);host.classList.remove('tilting');
  });
})();
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('modal-bg')){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.k,el);
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='npRate'){
    const t=+e.target.value||0;
    const el=document.getElementById('npRateCalc');
    if(el)el.innerHTML=t>10?`→ 플랫폼 <b>10%p</b> + 제안 수수료 <b style="color:var(--red)">${+(t-10).toFixed(1)}%</b> · 등급 보너스 포함 최대 <b>${+(t-10+GRADES[0].bonus).toFixed(1)}%</b> (블랙, 보너스는 플랫폼 부담)`
      :'<span style="color:var(--danger)">총 수수료율은 플랫폼 몫(10%)보다 커야 합니다</span>';
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('select[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.value,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatIn'){const b=document.querySelector('[data-act="sendChat"]');if(b)b.click();}
  if(e.key==='Escape')closeModal();
});
render();
</script>
