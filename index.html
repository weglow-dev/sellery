<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>셀러리 프로토타입</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2028%2032%27%20fill%3D%27none%27%20stroke%3D%27%232f5a1a%27%20stroke-width%3D%271.8%27%20stroke-linejoin%3D%27round%27%20stroke-linecap%3D%27round%27%3E%3Cellipse%20cx%3D%277%27%20cy%3D%279%27%20rx%3D%274.6%27%20ry%3D%275.4%27%20fill%3D%27%237cc142%27%20transform%3D%27rotate%28-28%207%209%29%27%2F%3E%3Cellipse%20cx%3D%2721%27%20cy%3D%279%27%20rx%3D%274.6%27%20ry%3D%275.4%27%20fill%3D%27%237cc142%27%20transform%3D%27rotate%2828%2021%209%29%27%2F%3E%3Cellipse%20cx%3D%2714%27%20cy%3D%277.4%27%20rx%3D%275.4%27%20ry%3D%276.2%27%20fill%3D%27%2393d64f%27%2F%3E%3Cpath%20d%3D%27M14%203.6v7.2M6.6%206.2l1.8%205.2M21.4%206.2l-1.8%205.2%27%20stroke%3D%27%233f7a24%27%20stroke-width%3D%271.2%27%2F%3E%3Cpath%20d%3D%27M7.2%2013h4.6v12.6a2.3%202.3%200%200%201-4.6%200z%27%20fill%3D%27%23d6ecad%27%2F%3E%3Cpath%20d%3D%27M16.2%2013h4.6v12.6a2.3%202.3%200%200%201-4.6%200z%27%20fill%3D%27%23d6ecad%27%2F%3E%3Cpath%20d%3D%27M11.7%2012.4h4.6v15a2.3%202.3%200%200%201-4.6%200z%27%20fill%3D%27%23eaf6cf%27%2F%3E%3Cpath%20d%3D%27M9.5%2015.5v8.5M14%2015v11M18.5%2015.5v8.5%27%20stroke%3D%27%23b5dc85%27%20stroke-width%3D%271.2%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@500;600;700;800;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2/dist/galmuri.css">
<style>
/* SELLERY — neo-brutalist editorial skin (single committed theme) */
:root{
  --bg:#efede2;
  --surface:#fdfcf6;
  --surface-2:#e6e3d4;
  --ink:#141414;
  --mute:#6d6a5c;
  --line:#141414;
  --soft-line:#d6d3c2;
  --red:#457c28; /* brand accent — warm celery-leaf green, tuned to the cream ground */
  --red-soft:#e8efda;
  --yellow:#f7df3e;
  --yellow-soft:#faf3c4;
  --money:#8f6400;
  --money-soft:#f5ecc9;
  --danger:#e03131;
  --danger-soft:#fbe3e0;
  --info:#2757a8;
  --info-soft:#e2ebf9;
  --brand-c:#2757a8; --brand-bg:#e2ebf9;
  --seller-c:#c02467; --seller-bg:#fbe0ec;
  --plat-c:#2f7d32; --plat-bg:#e2f0dd;
  --hs:4px 4px 0 var(--ink);
  --hs-sm:3px 3px 0 var(--ink);
  --hs-red:4px 4px 0 var(--red);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14.5px;line-height:1.65;
  /* 2026-09-14 가독성 수정: (1) Windows에서 subpixel AA를 끄던 antialiased 제거,
     (2) IBM Plex Sans KR은 700까지만 존재 → font-weight:800 지정 시 브라우저가 가짜볼드로
     글자를 뭉개던 문제를 font-synthesis로 차단(실제 있는 700을 사용) */
  font-synthesis-weight:none;font-synthesis:none;
  /* 한글은 단어(어절) 단위로만 줄바꿈 — '바인허/브'처럼 글자 중간에서 잘리지 않게 */
  word-break:keep-all;overflow-wrap:break-word}
button{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;cursor:pointer;
  border:2px solid var(--line);border-radius:4px;padding:9px 16px;
  background:var(--surface);color:var(--ink);font-weight:700;letter-spacing:.02em;
  box-shadow:var(--hs-sm);transition:transform .12s ease,box-shadow .12s ease}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--ink);color:var(--surface);box-shadow:var(--hs-red)}
button.pri:hover{box-shadow:5px 5px 0 var(--red)}
button.pri:active{box-shadow:1px 1px 0 var(--red)}
button.ghost{background:transparent}
button.danger{background:var(--red);color:#fff;box-shadow:var(--hs-sm)}
button.sm{padding:6px 12px;font-size:11.5px}
button[disabled]{cursor:not-allowed;opacity:.45;transform:none!important;box-shadow:var(--hs-sm)!important}
input,select,textarea{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:13px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:4px;padding:9px 12px;width:100%}
textarea{resize:vertical;font-family:'IBM Plex Sans KR',sans-serif}
:focus{outline:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== app bar ===== */
.appbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:22px;padding:12px 24px;flex-wrap:wrap}
.wordmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;white-space:nowrap;
  background:var(--surface);border:2px solid var(--line);box-shadow:var(--hs-red);padding:5px 16px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px}
.wordmark svg{flex-shrink:0;transform:rotate(-4deg)}
.wordmark .dot{color:var(--red);font-style:normal}
.roletabs{display:flex;gap:8px}
.roletabs button{background:transparent;border:2px solid transparent;box-shadow:none;color:var(--mute);
  padding:6px 12px;font-size:12px;letter-spacing:.08em;position:relative;text-transform:uppercase}
.roletabs button:hover{color:var(--ink);transform:none;box-shadow:none}
.roletabs button.on{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:var(--hs-sm)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  border:1.5px solid var(--ink);border-radius:999px;min-width:17px;height:17px;line-height:14px;padding:0 4px;text-align:center}
.master{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:999px;background:var(--surface);color:var(--ink)}
.iconbtn:hover{background:var(--yellow)}

/* ===== ticker ===== */
.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--ink)}
.ticker .tk{display:inline-block;padding:7px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;animation:tick 28s linear infinite}
.ticker em{font-style:italic;color:var(--yellow);letter-spacing:.05em}
.ticker .sp{color:var(--red);margin:0 18px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker .tk{animation:none}}

/* ===== sub nav ===== */
.subnav{display:flex;gap:8px;padding:16px 24px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap;align-items:center}
.subnav button{background:transparent;border:2px solid var(--line);box-shadow:none;padding:6px 14px;font-size:12px;color:var(--ink)}
.subnav button:hover{box-shadow:var(--hs-sm)}
.subnav button.on{background:var(--ink);color:var(--bg);box-shadow:var(--hs-red)}
.persona{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.persona select{width:auto;padding:5px 8px;font-size:12px}
@media(max-width:640px){
  .subnav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{white-space:nowrap;flex-shrink:0}
  .persona{margin-left:0;flex-shrink:0}
  .cats{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .cats::-webkit-scrollbar{display:none}
  .catchip{white-space:nowrap;flex-shrink:0}
}

main{max-width:1200px;margin:0 auto;padding:26px 24px 90px}
h2.pg{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:30px;font-weight:800;margin:8px 0 22px;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h2.pg small{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px;color:var(--mute);font-weight:400;margin-left:12px;letter-spacing:0;text-transform:none}

/* ===== hero band ===== */
.hero-band{position:relative;background:var(--bg);padding:34px 4px 58px;margin-bottom:-30px}
.hero-band .ey{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--red);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.hero-band .ey::before{content:'→ ';font-weight:400}
.hero-band h1{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:clamp(26px,4.4vw,44px);font-weight:800;margin:0;line-height:1.32;letter-spacing:-.015em;text-wrap:balance}
.hero-band h1 em{font-style:normal;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:0 8px;display:inline-block;transform:rotate(-.6deg)}
.hero-band .sub{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;color:var(--mute);margin-top:12px}
.hero-band .sub b{color:var(--ink)}
.overlap{position:relative;z-index:2}
main > *{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
main > *:nth-child(2){animation-delay:.04s}
main > *:nth-child(3){animation-delay:.08s}
main > *:nth-child(4){animation-delay:.12s}
main > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== category chips ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.catchip{background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:6px 14px;font-size:12px;color:var(--ink);font-weight:700;box-shadow:none;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.catchip:hover{box-shadow:var(--hs-sm)}
.catchip.on{background:var(--yellow);box-shadow:var(--hs-sm)}

/* ===== cards & grids ===== */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--hs)}
.kpi .lbl{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.kpi .val{font-family:'Archivo',sans-serif;font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--mute);margin-top:3px}
.sec{margin:36px 0 14px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.sec::before{content:'';width:10px;height:10px;background:var(--red)}
.sec::after{content:'';flex:1;height:2px;background:var(--ink)}
.lbl-sm{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:700}

/* ===== chips ===== */
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;vertical-align:middle;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.chip.brand{color:var(--brand-c);background:var(--brand-bg)}
.chip.seller{color:var(--seller-c);background:var(--seller-bg)}
.chip.plat{color:var(--plat-c);background:var(--plat-bg)}
.chip.auto{color:var(--mute);background:var(--surface-2)}
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border:1.5px solid var(--ink);border-radius:3px;white-space:nowrap;line-height:1.7;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.st.gray{background:var(--surface-2);color:var(--mute)}
.st.blue{background:var(--info-soft);color:var(--info)}
.st.green{background:var(--plat-bg);color:var(--plat-c)}
.st.amber{background:var(--yellow-soft);color:var(--money)}
.st.red{background:var(--danger-soft);color:var(--danger)}
.st.live{background:var(--red);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
.gradebox{display:inline-block;font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 10px;background:var(--yellow);border:2px solid var(--line);box-shadow:2px 2px 0 var(--ink);white-space:nowrap;flex-shrink:0}
.gradebox.sm{font-size:9.5px;padding:2px 7px;box-shadow:1.5px 1.5px 0 var(--ink)}
.meter{height:14px;border:2px solid var(--line);background:var(--surface);position:relative}
.meter span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--yellow),var(--yellow) 8px,var(--ink) 8px,var(--ink) 10px)}

/* ===== customer store (sellery.co.kr 구매 페이지) ===== */
.store{max-width:760px;margin:0 auto}
.store-trust{background:var(--bar);color:var(--bar-fg);font-size:12px;padding:8px 14px;margin:0 6px 10px 3px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.store-hero{position:relative;height:280px;display:flex;align-items:center;justify-content:center;background:conic-gradient(#f0f5e2 25%,#f7faee 0 50%,#f0f5e2 0 75%,#f7faee 0) 0 0/16px 16px;border-bottom:2px solid var(--ink)}
.store-hero .store-em{font-size:120px;line-height:1}
.store-hero .pxemoji{width:160px;height:160px}
.store-detail{text-align:center;padding:20px 10px}
.store-detail .store-em{display:flex;justify-content:center;margin-bottom:12px;font-size:64px}
.store-detail .pxemoji{width:96px;height:96px}
.store .meta,.store-ul{font-size:12.5px;color:var(--mute);line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;background:var(--surface);border:2px solid var(--soft-line);font-size:13px;cursor:pointer}
.opt.on{border-color:var(--ink);background:var(--yellow-soft);box-shadow:3px 3px 0 var(--ink)}
.opt b{font-family:'IBM Plex Mono',monospace;font-size:13px}
.qty{display:inline-flex;align-items:center;border:2px solid var(--line);background:var(--surface)}
.qty button{width:38px;height:38px;border:none;background:transparent;font-size:18px;box-shadow:none;margin:0}
.qty span{min-width:40px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700}
.store .buy{width:100%;padding:15px;font-size:15px}
.store-ul{margin:0;padding-left:18px;color:var(--ink);line-height:1.9}
.store-foot{font-size:11px;color:var(--mute);text-align:center;padding:18px 10px 30px;line-height:1.7}
/* ===== tables ===== */
.tblw{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:6px;box-shadow:var(--hs)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--ink);font-weight:700;background:var(--yellow-soft);padding:10px 16px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--soft-line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--yellow-soft)}
tr.merow td{background:var(--yellow-soft);font-weight:700}

/* ===== product cards ===== */
.prod{display:flex;flex-direction:column;gap:9px;transition:transform .14s ease,box-shadow .14s ease}
.prod:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.prod .ph{height:128px;border:2px solid var(--line);background:var(--surface-2);
  background-image:repeating-linear-gradient(-45deg,transparent,transparent 14px,rgba(20,20,20,.045) 14px,rgba(20,20,20,.045) 28px);
  display:flex;align-items:center;justify-content:center;font-size:44px;transform:rotate(-1.2deg);box-shadow:var(--hs-sm)}
.grid > .prod:nth-child(even) .ph{transform:rotate(1deg)}
.prod .nm{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase}
.prod .meta{font-size:12px;color:var(--mute)}
.prod .prices{display:flex;align-items:baseline;gap:8px}
.prod .gp{font-family:'Archivo',sans-serif;font-size:19px;font-weight:800}
.prod .cp{font-size:12px;color:var(--mute);text-decoration:line-through}
.prod .rate{font-size:10.5px;font-weight:800;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px;font-family:'IBM Plex Mono',monospace}

/* ===== campaign detail ===== */
.det-head{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;box-shadow:var(--hs)}
.det-head .t{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:19px;font-weight:800;text-transform:uppercase}
.det-body{display:grid;grid-template-columns:1fr 350px;gap:18px;margin-top:18px;align-items:start}
@media(max-width:900px){.det-body{grid-template-columns:1fr}}

/* ===== thread ===== */
.thread{background:var(--surface);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:440px;box-shadow:var(--hs)}
.thread .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:540px}
.msg{max-width:78%;padding:9px 13px;border:1.5px solid var(--ink);border-radius:4px;font-size:13.5px;background:var(--surface-2);box-shadow:2px 2px 0 var(--ink)}
.msg .who{font-size:10.5px;font-weight:800;margin-bottom:2px;letter-spacing:.04em;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.msg.seller{align-self:flex-start;background:var(--seller-bg)}
.msg.brand{align-self:flex-end;background:var(--brand-bg)}
.msg.admin{align-self:center;background:var(--lift2,#e6f0d2);border-style:dashed;max-width:88%}
.msg .tm{font-size:10.5px;color:var(--mute);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.sysline{align-self:center;font-size:11.5px;color:var(--mute);background:var(--bg);border:1.5px dashed var(--mute);border-radius:3px;padding:4px 14px;text-align:center}
.sysline b{color:var(--ink)}
.warnline{align-self:center;font-size:11.5px;color:#fff;background:var(--danger);border:1.5px solid var(--ink);border-radius:3px;padding:6px 13px;text-align:center;max-width:90%;box-shadow:2px 2px 0 var(--ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:2px solid var(--ink)}
.composer .as{font-size:10.5px;color:var(--mute);white-space:nowrap;align-self:center;font-weight:700;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.composer button{white-space:nowrap}

/* ===== action panel ===== */
.actions .card{margin-bottom:16px}
.actions h4{margin:0 0 8px;font-size:13.5px;font-weight:800}
.actions .hint{font-size:12.5px;color:var(--mute);margin:0 0 12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.sim{border:2px dashed var(--ink);background:var(--yellow-soft);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.sim h4{margin:0 0 4px;font-size:10.5px;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.sim p{font-size:11.5px;color:var(--mute);margin:0 0 10px}

/* ===== stepper ===== */
.stepper{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
.stp{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;padding:3px 8px;border:1.5px solid var(--soft-line);background:var(--surface);color:var(--mute);white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stp.done{background:var(--yellow-soft);border-color:var(--ink);color:var(--ink)}
.stp.now{background:var(--ink);border-color:var(--ink);color:var(--yellow)}

/* ===== calendar slots ===== */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;background:var(--surface-2);border:1.5px solid var(--ink);border-radius:3px;padding:8px 13px}
.slot .rng{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700}

/* ===== list rows ===== */
.rowitem{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--soft-line);cursor:pointer;flex-wrap:wrap;transition:background .1s}
.rowitem:last-child{border-bottom:none}
.rowitem:hover{background:var(--yellow-soft)}
.rowitem .grow{flex:1;min-width:180px}
.rowitem .nm{font-weight:800;font-size:14px}
.rowitem .sub{font-size:12px;color:var(--mute)}
.listcard{background:var(--surface);border:2px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.empty{padding:32px;text-align:center;color:var(--mute);font-size:13px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}

/* ===== modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:2px solid var(--line);border-radius:6px;max-width:530px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:8px 8px 0 var(--ink);animation:min .16s ease}
@keyframes min{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px;font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:18px;font-weight:800;text-transform:uppercase}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;color:var(--mute);margin-bottom:5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ===== buyer landing ===== */
.landing{border:2px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--hs)}
.landing .hero{background:var(--yellow);padding:34px 22px 26px;text-align:center;position:relative;border-bottom:2px solid var(--ink)}
.landing .hero::after{content:'LIMITED RUN';position:absolute;top:12px;left:50%;transform:translateX(-50%) rotate(-2deg);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.3em;color:#fff;background:var(--red);border:1.5px solid var(--ink);padding:2px 10px;font-weight:700}
.landing .hero .em{font-size:52px;display:block;margin-top:14px}
.landing .hero h3{font-family:'Archivo','IBM Plex Sans KR',sans-serif;margin:10px 0 3px;font-size:22px;font-weight:800;text-transform:uppercase}
.landing .hero .by{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11.5px;color:var(--ink)}
.landing .body{padding:20px 22px;background:var(--surface)}
.landing .pr{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-bottom:6px}
.landing .pr .g{font-family:'Archivo',sans-serif;font-size:31px;font-weight:800}
.landing .pr .c{color:var(--mute);text-decoration:line-through;font-size:13px}
.landing .timer{text-align:center;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px;color:var(--danger);font-weight:700;margin-bottom:14px;letter-spacing:.04em}
.landing .buy{width:100%;padding:14px;font-size:14px}

/* ===== toast ===== */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12.5px;font-weight:700;padding:11px 20px;border:2px solid var(--line);box-shadow:3px 3px 0 var(--red);animation:tin .2s ease;max-width:88vw}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== settlement ===== */
.stmt td:first-child{color:var(--mute)}
.stmt .tot td{font-weight:800;background:var(--yellow-soft);border-top:2px solid var(--ink)}
.notice{background:var(--info-soft);border:1.5px solid var(--info);border-radius:4px;padding:11px 15px;font-size:12.5px;color:var(--info);margin-bottom:16px}
code{font-family:'IBM Plex Mono',monospace;font-size:.9em;background:var(--yellow-soft);border:1px solid var(--soft-line);padding:1px 6px;border-radius:3px}

/* ===== live sales ===== */
.feed{max-height:300px;overflow-y:auto}
.feed .rowitem{cursor:default;padding:10px 16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars .b{flex:1;background:var(--ink);border:1.5px solid var(--ink);min-height:3px;position:relative}
.bars .b:last-child{background:var(--red)}
.bars .b .bl{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mute)}
.bars .b .bd{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mute)}
.barwrap{padding:4px 6px 24px}
.livegrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.livegrid{grid-template-columns:1fr}}
.autopo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ===== trend / exclusive ===== */
.trendbadge{position:absolute;top:8px;left:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:800;color:#fff;background:var(--danger);border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.04em}
.exclbadge{position:absolute;bottom:8px;right:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:800;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.06em;transform:rotate(1.2deg)}
.exclbox{background:var(--yellow-soft);border:2px solid var(--line);border-radius:4px;padding:12px 14px;box-shadow:var(--hs-sm)}

/* ===== grade pyramid & home news ===== */
.pyr{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:12px}
.pyr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--soft-line);padding:3px 10px;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10.5px;font-weight:700;max-width:100%;letter-spacing:.02em;white-space:nowrap}
.pyr-row span{white-space:nowrap}
.pyr-row .pct{color:var(--mute);font-weight:500}
.pyr-row.me{background:var(--yellow);border:2px solid var(--line);box-shadow:2px 2px 0 var(--ink);font-size:11.5px;padding:5px 13px;position:relative;z-index:1}
.pyr-row.me .pct{color:var(--ink);font-weight:700}
.news{display:flex;flex-direction:column}
.news-item{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-top:1px solid var(--soft-line);cursor:pointer;font-size:13px;line-height:1.55}
.news-item:hover{background:var(--yellow-soft)}
.nb{flex-shrink:0;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;font-weight:800;border:1.5px solid var(--ink);padding:1px 7px;letter-spacing:.06em;margin-top:2px;white-space:nowrap}
.nb.hot{background:var(--danger);color:#fff}
.nb.new{background:var(--red);color:#fff}
.nb.excl{background:var(--yellow);color:var(--ink)}

/* ===== avatars & platform icons ===== */
.plic{vertical-align:-2px;margin-right:1px}
.gi{vertical-align:-1.5px;margin-right:2px}
.mebadge{display:inline-block;font-family:'Archivo',sans-serif;font-size:8.5px;font-weight:800;background:var(--ink);color:var(--yellow);padding:1px 6px;letter-spacing:.14em;vertical-align:1.5px;line-height:1.6}

/* ===== peer bestseller bars ===== */
.hb-row{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.hb-row:hover .hb-nm{text-decoration:underline}
.hb-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{background:var(--surface-2);border:1.5px solid var(--ink);height:16px}
.hb-bar{height:100%;background:repeating-linear-gradient(-45deg,var(--ink),var(--ink) 7px,#3a3830 7px,#3a3830 9px)}
.hb-bar.top{background:repeating-linear-gradient(-45deg,var(--yellow),var(--yellow) 8px,var(--ink) 8px,var(--ink) 10px)}
.hb-val{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:640px){.hb-row{grid-template-columns:110px 1fr 78px}.hb-nm{font-size:11px}.hb-val{font-size:10px}}

/* ===== seller cards (gallery) ===== */
.scard{display:flex;flex-direction:column}
.rec-tag{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--yellow);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 10px;margin:-6px 0 12px;align-self:flex-start;transform:rotate(-.8deg)}
.sc-av{width:58px;height:58px;flex-shrink:0;border:2px solid var(--line);box-shadow:2.5px 2.5px 0 var(--ink);background-size:cover;background-position:center;background-color:var(--surface-2)}
.sc-av.em{display:flex;align-items:center;justify-content:center;font-size:26px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 12px}
.mini-stats>div{background:var(--surface-2);border:1.5px solid var(--soft-line);padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.ms-l{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:8.5px;color:var(--mute);letter-spacing:.05em;white-space:nowrap}
.ms-v{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;flex:1}
@media(max-width:640px){.mini-stats{grid-template-columns:repeat(2,1fr)}.sc-cols{grid-template-columns:1fr}}
.sc-hist{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:11.5px;border:1.5px solid var(--soft-line);background:var(--surface-2);padding:5px 9px;margin-bottom:5px;cursor:pointer}
.sc-hist:hover{border-color:var(--ink)}
.sc-hist .st{font-size:9px;padding:1px 6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;border-bottom:1.5px solid var(--ink);padding:0 2px}
.spark span{flex:1;background:var(--red);border:1px solid var(--ink);border-bottom:none;min-height:4px}

/* ===== gongu calendar ===== */
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.cal-legend{margin-left:auto;font-size:10.5px;color:var(--mute);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cal-legend span{white-space:nowrap}
.lg{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px}
.lg.plan{background:var(--yellow)}.lg.live{background:var(--red)}.lg.done{background:var(--surface-2)}.lg.pay{background:var(--money-soft)}.lg.due{background:var(--danger)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:10px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--soft-line);text-align:center;padding:7px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:68px;border-top:1px solid var(--soft-line);border-left:1px solid var(--soft-line);padding:4px 4px 6px;overflow:hidden}
.cal-cell:nth-child(7n+1){border-left:none}
.cal-cell.off{background:repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(20,20,20,.03) 6px,rgba(20,20,20,.03) 12px)}
.cal-cell .dn{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute)}
.cal-cell.today{background:var(--yellow-soft)}
.cal-cell.today .dn{font-weight:800;color:var(--ink);background:var(--yellow);border:1px solid var(--ink);padding:0 4px}
.cal-ev{font-size:9px;font-weight:700;border:1px solid var(--ink);padding:0 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.8;border-radius:2px}
.cal-ev.plan{background:var(--yellow)}
.cal-ev.live{background:var(--red);color:#fff}
.cal-ev.done{background:var(--surface-2);color:var(--mute)}
.cal-ev.pay{background:var(--money-soft);color:var(--money)}
.cal-ev.due{background:var(--danger);color:#fff}
@media(max-width:640px){.cal-cell{min-height:54px;padding:3px}.cal-ev{font-size:7.5px;padding:0 2px}.cal-legend{margin-left:0}}
.hero-av{position:absolute;top:30px;right:6px;width:88px;height:88px;object-fit:cover;border:2px solid var(--line);box-shadow:4px 4px 0 var(--ink);transform:rotate(2deg);background:var(--surface)}
@media(max-width:640px){.hero-av{position:static;display:block;width:64px;height:64px;margin:0 0 12px;transform:rotate(-2deg)}}
.ph.av{background-size:cover;background-position:center;transform:none!important}

/* ======================================================================
   SKIN: light-pixel-celery v5 — 단색 셀러리 배경 · 본문은 원래 폰트 · 강조 포인트만 픽셀
   원복 방법: 이 블록(=== SKIN ~ /SKIN ===)과 <head>의 galmuri <link>만 삭제하면 네오브루탈로 복귀.
   git 스냅샷: tag skin-neobrutal-v1
   ====================================================================== */
:root{
  --bg:#eef3dc; --surface:#f8faee; --surface-2:#e2ead0;
  --ink:#1c2a14; --mute:#5b6b4a; --line:#1c2a14; --soft-line:#c9d4ae;
  --red:#4f8a2c; --red-soft:#dfeccc;
  --yellow:#b7e34a; --yellow-soft:#e8f3c6;
  --money:#8a6a12; --money-soft:#f1ecd0;
  --plat-c:#2f6a1e; --plat-bg:#dfeccc;
  --seller-c:#b0326a; --seller-bg:#f7e2ec;
  --brand-c:#2f63b8; --brand-bg:#e2ebf9;
  --px14:'Galmuri14','Galmuri11','IBM Plex Sans KR',sans-serif;
  --px11:'Galmuri11','Galmuri14','IBM Plex Sans KR',sans-serif;
  --pxb:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
  --pxd:3px 6px 0 0 var(--ink),6px 3px 0 0 var(--ink),6px 6px 0 0 var(--ink);
  --pxb2:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --pxd2:2px 4px 0 0 var(--ink),4px 2px 0 0 var(--ink),4px 4px 0 0 var(--ink);
  --bevel:inset 0 3px 0 rgba(255,255,255,.8),inset 3px 0 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(28,42,20,.13),inset -3px 0 0 rgba(28,42,20,.13);
  --bevel2:inset 0 2px 0 rgba(255,255,255,.75),inset 2px 0 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(28,42,20,.18),inset -2px 0 0 rgba(28,42,20,.18);
  --checker:repeating-linear-gradient(90deg,var(--red) 0 4px,var(--yellow) 4px 8px);
  --bar:#2f5a1a;   /* 윈도우 타이틀바·인증 띠 (사용자 선택 C: 딥 그린 + 라임 글자) */
  --bar-fg:#d8ee9a;
}
/* ---- 그라운드: 단색, 앱바·탭도 투명해서 배경이 맨 위까지 ---- */
body{background:var(--bg);background-image:none}
.appbar{background:transparent;border-bottom:none;box-shadow:none;padding-top:14px}
.subnav{background:transparent}
/* ---- 픽셀 폰트는 강조 포인트에만 (연속 텍스트는 원래 폰트) ---- */
.wordmark,.st,.badge,.mebadge,.nb,.trendbadge,.exclbadge,.gradebox,.stp,.cal-ev,.chip-master{font-family:var(--px11)!important;letter-spacing:0!important;font-weight:400!important;text-transform:none!important}
.kpi .val,.prod .gp,.landing .pr .g,.mini-stats .ms-v,.hb-val{font-family:var(--px14)!important;letter-spacing:0!important;font-weight:400!important}
.st,.gradebox,.nb,.trendbadge,.exclbadge,.badge,.mebadge,.stp,.cal-ev{font-size:11px;line-height:1.7}
.kpi .val{font-size:28px;line-height:1.3;margin-top:6px;color:var(--ink)}
.prod .gp{font-size:22px}
.landing .pr .g{font-size:28px}
.mini-stats .ms-v{font-size:14px}
.hb-val{font-size:11px}
.badge{min-width:18px;height:18px;line-height:18px;font-size:11px}
/* ---- 로고: 흰 박스 + 픽셀 폰트 + 셀러리 그린 ---- */
.wordmark{background:#ffffff;color:var(--red);border:none!important;border-radius:0;box-shadow:var(--pxb2),var(--pxd2),var(--bevel2);padding:8px 14px;margin:3px 6px 6px 3px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.wordmark .dot{color:var(--ink)}
.wordmark svg{transform:none}
.iconbtn{background:#fff;width:36px;height:36px}
/* ---- 카드/패널: 파인 모서리 프레임 + 베벨 + 픽셀 드롭섀도 + 체커 타이틀 스트립 ---- */
.card,.listcard,.tblw,.det-head,.thread,.modal,.landing,.sim,.exclbox,.sc-av,.mini-stats>div,.prod .ph{
  border:none!important;border-radius:0;margin:3px 6px 6px 3px;box-shadow:var(--pxb),var(--pxd),var(--bevel);position:relative}
.card::before,.listcard::before,.tblw::before,.det-head::before,.thread::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--checker);pointer-events:none}
.mini-stats>div::before,.prod .ph::before,.sc-av::before,.sim::before,.exclbox::before,.landing::before{display:none}
.card,.det-head,.thread{padding-top:22px}
.card:hover,.prod:hover{transform:translate(-2px,-2px);box-shadow:var(--pxb),5px 8px 0 0 var(--ink),8px 5px 0 0 var(--ink),8px 8px 0 0 var(--ink),var(--bevel)}
.grid{gap:20px}
.sim{background:var(--yellow-soft)}
.notice,.sc-hist,.slot,.msg,.hb-track,.cal-ev,.pyr-row,.stp,.nb,.chip,.st,.gradebox,.catchip,input,select,textarea,.toast,.mebadge,.badge{border-radius:0}
.pyr-row{border:none!important;box-shadow:var(--pxb2);margin:2px 4px;background:var(--surface)}
.pyr-row.me{background:var(--yellow);box-shadow:var(--pxb2),2px 2px 0 0 var(--ink),var(--bevel2)}
.msg{border:none!important;box-shadow:var(--pxb2),2px 2px 0 0 var(--ink);margin:2px 6px 4px 4px}
.sysline{border:none;background:var(--surface-2);box-shadow:var(--pxb2);margin:2px 4px}
.warnline{border:none;box-shadow:var(--pxb2)}
.sc-hist,.slot{border:none;box-shadow:var(--pxb2);margin:2px 4px 6px}
.hb-track{border:none;box-shadow:var(--pxb2);margin:2px 3px}
.notice{border:none;box-shadow:var(--pxb2);margin:3px}
/* ---- 히어로: 게임 다이얼로그 윈도우 (아바타는 우측 상단 고정 — 가림 방지) ---- */
.hero-band{background:var(--surface);box-shadow:var(--pxb),var(--pxd),var(--bevel);margin:3px 6px 26px 3px;padding:44px 28px 22px;position:relative}
.overlap{margin-top:0}
.hero-band::before{content:'◼ ◼ ◼';position:absolute;top:0;left:0;right:0;height:22px;background:var(--bar);color:var(--bar-fg);font-size:11px;line-height:22px;padding-left:12px;letter-spacing:4px;font-family:var(--px11)}
.hero-band::after{content:'SELLERY.EXE';position:absolute;top:0;right:12px;height:22px;color:var(--bar-fg);font-size:11px;line-height:22px;font-family:var(--px11)}
.hero-av{position:absolute!important;top:40px!important;right:18px!important;left:auto!important;margin:0!important;transform:none;border-radius:0;border:none!important;box-shadow:var(--pxb),var(--pxd)}
@media(max-width:640px){.hero-av{width:64px!important;height:64px!important;top:34px!important;right:12px!important}}
.hero-band .ey{color:var(--red)}
/* ---- 헤드라인 강조: 라임 박스 + 픽셀 테두리 ---- */
/* 헤드라인 강조: 테두리 없이 뒤에 살짝 튀어나온 라임 마커 블록 (사용자 요청) */
.hero-band h1{position:relative;z-index:0}
.hero-band h1 em{background:none;box-shadow:none;border:none;padding:0 4px;transform:none;color:var(--ink);font-style:normal;position:relative;z-index:auto;display:inline-block}
.hero-band h1 em::before{content:'';position:absolute;z-index:-1;left:-4px;right:-6px;top:6%;bottom:2%;background:var(--yellow);transform:translate(4px,5px) rotate(-1.2deg);border-radius:2px}
/* ---- 버튼: 게임 버튼 ---- */
button,button.pri,button.ghost,button.danger,button.sm,.master button{border:none!important;border-radius:0;box-shadow:var(--pxb2),var(--pxd2),var(--bevel2);margin:2px 5px 6px 2px}
button:hover,button.pri:hover,button.ghost:hover,button.danger:hover,button.sm:hover{transform:translate(-1px,-1px);box-shadow:var(--pxb2),3px 5px 0 0 var(--ink),5px 3px 0 0 var(--ink),5px 5px 0 0 var(--ink),var(--bevel2)}
button:active,button.pri:active,button.ghost:active,button.danger:active,button.sm:active{transform:translate(2px,2px);box-shadow:var(--pxb2),inset 2px 2px 0 rgba(28,42,20,.2)}
button.pri{background:var(--yellow);color:var(--ink)}
button.ghost{background:var(--surface)}
button.danger{background:var(--danger);color:#fff}
button[disabled]{box-shadow:var(--pxb2)!important;opacity:.45;transform:none!important}
.roletabs button,.roletabs button.on{box-shadow:none!important;margin:0;background:transparent}
.roletabs button.on{background:var(--yellow);box-shadow:var(--pxb2)!important}
.subnav button{background:var(--surface);color:var(--ink)}
.subnav button.on{background:var(--ink);color:var(--yellow)}
.catchip{border:none;box-shadow:var(--pxb2);margin:2px 4px;background:var(--surface)}
.catchip.on{background:var(--yellow)}
input,select,textarea{border:none;box-shadow:var(--pxb2),inset 2px 2px 0 rgba(28,42,20,.1);background:#fff;margin:2px}
/* ---- 태그/칩: LED 상태 태그(픽셀 폰트·점멸) + 플랫 컬러 칩 ---- */
.st{border:none!important;box-shadow:var(--pxb2),2px 2px 0 0 var(--ink);padding:3px 10px 3px 8px;margin:2px 5px 4px 4px}
.st::before{content:'';display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:1px;background:currentColor;box-shadow:inset 1px 1px 0 rgba(255,255,255,.55);animation:led 1.2s steps(1) infinite}
@keyframes led{50%{opacity:.35}}
.st.blue{background:#2f63b8;color:#fff}
.st.amber{background:#e3b93c;color:#1c2a14}
.st.green{background:var(--red);color:#fff}
.st.gray{background:#7a876b;color:#fff}
.st.red{background:var(--danger);color:#fff}
.st.live{background:var(--ink);color:var(--yellow)}
.st.live .pulse{display:none}
.st.live::before{content:'LIVE';width:auto;height:auto;background:none;box-shadow:none;margin-right:7px;color:var(--yellow);animation:led 1s steps(1) infinite}
.chip{border:none!important;box-shadow:var(--pxb2);padding:1px 8px;margin:2px 4px}
.chip.brand{background:var(--brand-bg);color:var(--brand-c)}
.chip.seller{background:var(--seller-bg);color:var(--seller-c)}
.chip.plat{background:var(--plat-bg);color:var(--plat-c)}
.gradebox{border:none!important;box-shadow:var(--pxb2),2px 2px 0 0 var(--ink);background:var(--yellow);margin:2px 5px 4px 4px;padding:2px 8px}
.nb,.trendbadge,.exclbadge{border:none!important;box-shadow:var(--pxb2),2px 2px 0 0 var(--ink);transform:none;margin:3px}
.mebadge{background:var(--ink);color:var(--yellow);padding:1px 6px}
.badge{border:none;box-shadow:var(--pxb2);background:var(--danger)}
/* ---- 섹션 헤더: 픽셀 화살표 + 점선 ---- */
.sec::before{width:0;height:0;background:none;box-shadow:none;border-left:8px solid var(--red);border-top:6px solid transparent;border-bottom:6px solid transparent}
.sec::after{height:4px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px)}
/* ---- 상품 썸네일: 누끼 공통 스테이지 (연한 셀러리 톤 + 저대비 픽셀 체커 + 바닥 그림자, 이미지는 바닥 정렬) ---- */
.prod .ph,.grid > .prod:nth-child(even) .ph{transform:none;background:conic-gradient(#f0f5e2 25%,#f7faee 0 50%,#f0f5e2 0 75%,#f7faee 0) 0 0/16px 16px;align-items:flex-end;padding-bottom:22px;height:136px}
.prod .ph::after{content:'';position:absolute;left:26%;right:26%;bottom:10px;height:6px;background:rgba(28,42,20,.16);box-shadow:-10px 0 0 0 rgba(28,42,20,.07),10px 0 0 0 rgba(28,42,20,.07);pointer-events:none}
.prod .ph img{max-height:80%!important;max-width:74%!important;position:relative;z-index:1;filter:drop-shadow(0 0 0 transparent)}
.prod .ph .pxemoji{position:relative;z-index:1;margin-bottom:-2px}
/* ---- 그라운드: 단색 (사용자 결정 — 체커 배경 폐기) ---- */
.prod .rate{background:var(--yellow);border:none;box-shadow:var(--pxb2);margin:2px 4px;font-family:var(--px11)!important;font-weight:400!important}
.sc-av{transform:none;border-radius:0}
/* ---- 게이지/막대: 픽셀 블록 ---- */
.meter{border:none;box-shadow:var(--pxb2);height:12px;margin:3px;background:var(--surface)}
.meter span{background:repeating-linear-gradient(90deg,var(--red) 0 8px,var(--yellow) 8px 12px)}
.hb-bar{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,#3a5230 6px 8px)}
.hb-bar.top{background:repeating-linear-gradient(90deg,var(--red) 0 6px,var(--yellow) 6px 8px)}
.bars .b{border:none;box-shadow:var(--pxb2);background:var(--red)}
.spark span{background:var(--red);border:none;box-shadow:1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.stp{border:none;box-shadow:var(--pxb2);margin:2px 3px}
.stp.now{background:var(--ink);color:var(--yellow)}
.stp.done{background:var(--yellow-soft)}
.cal-cell.today .dn{background:var(--yellow);border:none;box-shadow:var(--pxb2)}
.cal-ev{border:none!important;box-shadow:var(--pxb2);margin:3px 3px 2px}
.toast{border:none;box-shadow:var(--pxb2),3px 3px 0 0 var(--red)}
/* ---- v6: 레트로 OS 포인트 (마인크래프트 감성) ---- */
/* 상단바 고정 해제 */
.appbar{position:static}
/* 로고: 굵은 픽셀 SELLERY (2px 쉬프트 볼드) */
.wordmark{font-family:var(--px11)!important;font-size:22px;line-height:1.1;letter-spacing:2px!important;text-transform:uppercase!important;text-shadow:2px 0 0 currentColor,0 2px 0 currentColor,2px 2px 0 currentColor;color:var(--red);padding:6px 16px 6px 14px;gap:0}
.wordmark .celogo{width:24px;height:28px;margin:0 9px 0 0;vertical-align:middle;display:inline-block;transform:none}
.wordmark .dot{margin-left:1px}
.wordmark .dot{color:var(--ink)}
.wordmark svg{width:24px;height:24px;shape-rendering:crispEdges;image-rendering:pixelated}
/* 카드 = 레트로 윈도우: 다크 타이틀바 + ◼ ◼ ◼ + 우측 파일명 */
.card::before,.listcard::before,.tblw::before,.thread::before,.det-head::before{content:'◼ ◼ ◼';height:18px;background:var(--bar);color:var(--bar-fg);font-family:var(--px11);font-size:11px;line-height:18px;padding-left:10px;letter-spacing:3px}
.card::after,.listcard::after,.tblw::after,.thread::after,.det-head::after{content:attr(data-win);position:absolute;top:0;right:10px;height:18px;line-height:18px;color:var(--bar-fg);font-family:var(--px11);font-size:11px;pointer-events:none}
.card,.det-head,.thread{padding-top:30px}
.listcard,.tblw{padding-top:18px}
.mini-stats>div::before,.mini-stats>div::after,.prod .ph::before,.prod .ph::after,.sc-av::before,.sim::before,.exclbox::before,.landing::before{display:none}
.modal{padding-top:26px}
.modal::before{content:'◼ ◼ ◼';position:absolute;top:0;left:0;right:0;height:18px;background:var(--bar);color:var(--bar-fg);font-family:var(--px11);font-size:11px;line-height:18px;padding-left:10px;letter-spacing:3px}
.modal::after{content:'DIALOG.EXE';position:absolute;top:0;right:10px;height:18px;line-height:18px;color:var(--bar-fg);font-family:var(--px11);font-size:11px}
/* 헤드라인 끝 블록 커서 */
.hero-band h1::after{content:'';display:inline-block;width:.22em;height:.82em;background:var(--red);margin-left:.18em;vertical-align:-.06em;animation:led 1s steps(1) infinite}
/* KPI 숫자·가격: 원래 폰트 복귀 (픽셀은 태그·뱃지·로고에만) */
.kpi .val{font-family:'Archivo','IBM Plex Sans KR',sans-serif!important;font-weight:800!important;font-size:29px;letter-spacing:-.02em!important}
.prod .gp,.landing .pr .g,.mini-stats .ms-v,.hb-val{font-family:'Archivo','IBM Plex Sans KR',sans-serif!important;font-weight:800!important;letter-spacing:-.01em!important}
.prod .gp{font-size:20px}.landing .pr .g{font-size:30px}.mini-stats .ms-v{font-size:13px}.hb-val{font-family:'IBM Plex Mono',monospace!important;font-weight:400!important;font-size:11px}
/* 가격: 할인율 픽셀 뱃지 */
.disc{font-family:var(--px11);font-size:11px;background:var(--danger);color:#fff;padding:2px 6px;box-shadow:var(--pxb2);margin:2px 6px;vertical-align:2px;animation:led 2.4s steps(1) infinite}
.prod .prices{align-items:center;flex-wrap:wrap;row-gap:6px}
/* 판매 행 가독성 */
.rowitem .sub{font-size:13px;color:var(--mute)}
.rowitem > span.sub{font-size:13px;color:var(--ink);font-family:var(--px11)!important;background:var(--surface-2);padding:2px 8px;box-shadow:var(--pxb2);margin:2px 6px}
/* 등급 게이지: 마인크래프트 XP바 (세그먼트) */
.meter{height:14px}
.meter span{background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--yellow) 10px 12px,var(--ink) 12px 14px)}
/* 픽셀 이모지 캔버스 */
.pxemoji{image-rendering:pixelated;display:block}
.prod .ph .pxemoji{width:72px;height:72px}
.rowitem .pxemoji,.det-head .pxemoji{width:36px;height:36px}
.sc-av .pxemoji{width:44px;height:44px}
/* 픽셀 커서 · 스크롤바 · 선택 */
body{cursor:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='26' viewBox='0 0 28 32' fill='none' stroke='%232f5a1a' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'%3E%3Cellipse cx='7' cy='9' rx='4.6' ry='5.4' fill='%237cc142' transform='rotate%28-28 7 9%29'/%3E%3Cellipse cx='21' cy='9' rx='4.6' ry='5.4' fill='%237cc142' transform='rotate%2828 21 9%29'/%3E%3Cellipse cx='14' cy='7.4' rx='5.4' ry='6.2' fill='%2393d64f'/%3E%3Cpath d='M14 3.6v7.2M6.6 6.2l1.8 5.2M21.4 6.2l-1.8 5.2' stroke='%233f7a24' stroke-width='1.2'/%3E%3Cpath d='M7.2 13h4.6v12.6a2.3 2.3 0 0 1-4.6 0z' fill='%23d6ecad'/%3E%3Cpath d='M16.2 13h4.6v12.6a2.3 2.3 0 0 1-4.6 0z' fill='%23d6ecad'/%3E%3Cpath d='M11.7 12.4h4.6v15a2.3 2.3 0 0 1-4.6 0z' fill='%23eaf6cf'/%3E%3Cpath d='M9.5 15.5v8.5M14 15v11M18.5 15.5v8.5' stroke='%23b5dc85' stroke-width='1.2'/%3E%3C/svg%3E") 11 2,auto}
button,a,.rowitem,.hb-row,.news-item,.catchip,[data-act]{cursor:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='28' viewBox='0 0 28 32' fill='none' stroke='%232f5a1a' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'%3E%3Cg transform='rotate%28-18 14 16%29'%3E%3Cellipse cx='7' cy='9' rx='4.6' ry='5.4' fill='%237cc142' transform='rotate%28-28 7 9%29'/%3E%3Cellipse cx='21' cy='9' rx='4.6' ry='5.4' fill='%237cc142' transform='rotate%2828 21 9%29'/%3E%3Cellipse cx='14' cy='7.4' rx='5.4' ry='6.2' fill='%2393d64f'/%3E%3Cpath d='M14 3.6v7.2M6.6 6.2l1.8 5.2M21.4 6.2l-1.8 5.2' stroke='%233f7a24' stroke-width='1.2'/%3E%3Cpath d='M7.2 13h4.6v12.6a2.3 2.3 0 0 1-4.6 0z' fill='%23d6ecad'/%3E%3Cpath d='M16.2 13h4.6v12.6a2.3 2.3 0 0 1-4.6 0z' fill='%23d6ecad'/%3E%3Cpath d='M11.7 12.4h4.6v15a2.3 2.3 0 0 1-4.6 0z' fill='%23eaf6cf'/%3E%3Cpath d='M9.5 15.5v8.5M14 15v11M18.5 15.5v8.5' stroke='%23b5dc85' stroke-width='1.2'/%3E%3C/g%3E%3C/svg%3E") 12 2,pointer}
::selection{background:var(--yellow);color:var(--ink)}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--surface-2)}
::-webkit-scrollbar-thumb{background:var(--red);border:3px solid var(--surface-2);box-shadow:inset 2px 2px 0 rgba(255,255,255,.4)}
/* 부팅 화면 (세션 첫 진입 1회) */
.boot{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;transition:opacity .3s steps(3)}
.boot.out{opacity:0}
.boot-win{width:min(420px,88vw);background:var(--surface);box-shadow:var(--pxb),var(--pxd),var(--bevel);position:relative;padding:36px 28px 30px;text-align:center}
.boot-bar{position:absolute;top:0;left:0;right:0;height:18px;background:var(--bar);color:var(--bar-fg);font-family:var(--px11);font-size:11px;line-height:18px;padding-left:10px;letter-spacing:3px;text-align:left}
.boot-bar span{position:absolute;right:10px;letter-spacing:0}
.boot-logo{font-family:var(--px14);font-size:42px;color:var(--red);text-shadow:3px 0 0 currentColor,6px 0 0 currentColor,0 3px 0 currentColor,3px 3px 0 currentColor,6px 3px 0 currentColor;line-height:1.2}
.boot-logo span{color:var(--ink)}
.boot-txt{font-family:var(--px11);font-size:11px;color:var(--mute);margin:14px 0 18px}
.boot-prog{height:16px;box-shadow:var(--pxb2);margin:0 20px;background:var(--surface-2)}
.boot-prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--yellow) 10px 12px,var(--ink) 12px 14px);animation:bootfill 1.15s steps(14) forwards}
@keyframes bootfill{to{width:100%}}
@media(prefers-reduced-motion:reduce){.boot{display:none}.disc,.hero-band h1::after,.st::before{animation:none}}
/* 모바일 최적화: 히어로 — 아바타를 위로, 제목 축소, 여백 축소 */
@media(max-width:640px){
  .hero-band{padding:38px 16px 18px;margin:3px 4px 20px 3px}
  .hero-band h1{font-size:24px;line-height:1.4}
  .hero-band h1::after{height:.8em}
  .hero-av{position:static!important;display:block;width:60px!important;height:60px!important;margin:0 0 12px!important;top:auto!important;right:auto!important}
  .hero-band .sub{line-height:2}
  .hero-band .sub button{margin-top:6px}
  .card,.listcard,.tblw,.det-head,.thread{margin:3px 4px 6px 3px}
  .kpi .val{font-size:24px}
  main{padding:18px 14px 80px}
  .appbar{padding:10px 14px}
  .wordmark{font-size:18px;padding:5px 12px}
  .wordmark .ylogo{width:12px;height:17px;vertical-align:-5px}
}
/* 표: 데스크톱은 열 압축(상품명 줄바꿈 금지), 900px 이하는 카드형으로 펼침 (가로 스크롤 없음) */
.tblw.compact th,.tblw.compact td{padding:10px 12px}
.tblw td.nm{min-width:180px}
.tblw td.nm b{white-space:nowrap}
.tblw td.nm b .st{white-space:nowrap}
@media(max-width:900px){
  .tblw{overflow:visible}
  .tblw table{min-width:0;width:100%}
  .tblw thead{display:none}
  .tblw tbody tr{display:block;padding:10px 12px;border-bottom:2px solid var(--soft-line)}
  .tblw tbody tr:last-child{border-bottom:none}
  .tblw td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:4px 0;text-align:right;white-space:normal!important;min-width:0}
  .tblw td.nm{text-align:left;flex-direction:column;align-items:flex-start;gap:2px}
  .tblw td.nm::before{content:none}
  .tblw td.nm b{white-space:normal}
  .tblw td::before{content:attr(data-l);color:var(--mute);font-size:11px;text-align:left;flex-shrink:0;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
  .tblw td[data-l=""]::before{content:none}
  .tblw td:empty{display:none}
  .tblw td.empty{display:block;text-align:center}
  .tblw td.empty::before{content:none}
  .tblw tr.clickable td{background:transparent}
  .stmt td{display:table-cell;text-align:inherit}
  .stmt td::before{content:none}
}
/* 셀러리 포인트 */
.celic{vertical-align:-3px;margin-right:2px}
.celery-bal{display:inline-flex;align-items:center;gap:4px;font-family:var(--px11)!important;font-size:13px;background:#fff;color:var(--ink);padding:6px 12px;box-shadow:var(--pxb2),var(--pxd2),var(--bevel2);margin:2px 8px 6px 2px;cursor:pointer}
.celprice{font-family:var(--px11)!important;font-size:13px;background:var(--yellow);padding:4px 10px;box-shadow:var(--pxb2);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.blurrow td{filter:blur(4px);user-select:none;pointer-events:none}
/* 갤러리 데이터 게이트 (🥬 2) */
.gate{position:relative;display:flex;flex-direction:column;flex:1}
.gate.locked .mini-stats,.gate.locked .sc-cols{filter:blur(5px);user-select:none;pointer-events:none}
.gate-cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(238,243,220,.35);text-align:center}
.gate-cta span{font-size:11px;color:var(--ink);background:var(--surface);padding:3px 10px;box-shadow:var(--pxb2)}
.kpi .val .celic{width:16px;height:22px}
/* DM 안 읽음 점 */
.dmdot{display:inline-block;width:8px;height:8px;background:var(--danger);margin-left:8px;vertical-align:1px;box-shadow:var(--pxb2);animation:led 1.2s steps(1) infinite}
/* 인라인 padding:0 카드(주문 피드·뉴스)도 타이틀바 아래로 내용 밀기 */
.card[style*="padding:0"]{padding-top:18px!important}
.card[style*="padding:0"] > .lbl-sm{padding-top:14px}
/* ---- 로고 최종(2026-09-03): 네오브루탈 흰 박스 + Archivo 볼드 잉크 텍스트 + 그린 점 + 일러스트 셀러리 아이콘 (픽셀 폰트·가짜볼드 제거) ---- */
.wordmark{font-family:'Archivo','IBM Plex Sans KR',sans-serif!important;font-weight:800!important;font-size:18px;letter-spacing:.06em!important;text-transform:uppercase!important;text-shadow:none;color:var(--ink);background:#fff;padding:8px 14px 8px 12px;gap:8px;box-shadow:var(--pxb2),4px 4px 0 0 var(--ink);line-height:1}
.wordmark .dot{color:var(--red);margin-left:2px}
.wordmark .celogo{width:24px;height:28px;margin:0;shape-rendering:auto;image-rendering:auto;display:block;transform:rotate(-14deg);transform-origin:50% 80%}  /* 사용자 선택 2026-09-10: 로고 셀러리 살짝 왼쪽 기울임 */
.boot-logo{font-family:'Archivo','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:40px;letter-spacing:.06em;color:var(--ink);text-shadow:none;display:flex;align-items:center;justify-content:center}
.boot-logo span{color:var(--red)}
.boot-logo .celogo{shape-rendering:auto;transform:rotate(-14deg);transform-origin:50% 80%}
@media(max-width:640px){.wordmark{font-size:16px;padding:6px 12px 6px 10px}.wordmark .celogo{width:20px;height:24px}}
/* ==== v7 정돈 (2026-09-03, 대표 피드백 반영): 픽셀 셀러리 컨셉 유지 + 장식 밀도 축소 + 위계 회복.

:root{--lift:#dae8bf;--lift2:#e6f0d2}

.st,.gradebox,.nb,.trendbadge,.exclbadge,.stp,.cal-ev,.disc,.rowitem > span.sub,.celprice{box-shadow:var(--pxbl-soft),var(--pxd-s1)}
/* 리프트 최종 통일 (이전 규칙보다 우선) */
.card:hover,.listcard:hover,.tblw:hover,.det-head:hover,.thread:hover,.landing:hover,.sim:hover,.exclbox:hover{
  transform:translate(-2px,-2px)!important;box-shadow:var(--pxbl),var(--pxd-3)!important}
.card.prod:hover,.kpi.go:hover{transform:translate(-3px,-3px)!important;box-shadow:var(--pxbl),var(--pxd-3)!important}
.hero-band:hover{transform:none!important;box-shadow:var(--pxbl),var(--pxd-2)!important}
button:hover,button.pri:hover,button.ghost:hover,button.sm:hover,button.danger:hover{
  transform:translate(-1px,-1px)!important;box-shadow:var(--pxbl),var(--pxd-s2)!important}
button:active{transform:translate(1px,1px)!important;box-shadow:var(--pxbl)!important}
.subnav button:hover,.catchip:hover{transform:translate(-1px,-1px)!important;box-shadow:var(--pxbl),var(--pxd-s2)!important}
.subnav button.on:hover{box-shadow:0 -2px 0 0 var(--bar),0 2px 0 0 var(--bar),-2px 0 0 0 var(--bar),2px 0 0 0 var(--bar),var(--pxd-2)!important}
/* 1) 모달 스크롤 복구 (노치 패치의 overflow:visible이 내부 스크롤을 막던 문제) */
.modal{overflow-y:auto!important;overflow-x:hidden!important;max-height:88vh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-bg{overflow-y:auto;padding:16px 0}
@media(max-width:640px){
  .modal{max-height:92vh;margin:8px}
  .modal .foot{position:sticky;bottom:-1px;background:var(--surface);padding-top:10px;margin-top:6px;box-shadow:0 -8px 12px -8px rgba(28,42,20,.25)}
}
/* 2) 카드형 표 정리: 라벨 | 값 2열 그리드로 (셀 안 여러 요소가 깨져 보이던 문제) */
@media(max-width:900px){
  .tblw table{table-layout:auto!important}
  .tblw tbody td{display:grid!important;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0!important;word-break:keep-all}
  .tblw tbody td::before{min-width:0!important;flex:none!important;padding-top:2px;line-height:1.5}
  .tblw tbody td.nm,.tblw tbody td[data-l=""]{display:block!important}
  .tblw tbody td>div{margin:0}
  .tblw tbody td>div[style*="display:flex"],.tblw tbody td .btnrow{flex-wrap:wrap;gap:6px}
  .tblw tbody td>b+div,.tblw tbody td>div+div{margin-top:3px}
  .tblw tbody tr{padding:12px 14px}
  .tblw tbody td button{margin:0}
}
/* 카드형 표: 값이 여러 조각이어도 항상 오른쪽 열에 쌓이게 */
@media(max-width:900px){
  .tblw tbody td::before{grid-column:1;grid-row:1;align-self:start}
  .tblw tbody td>*{grid-column:2}
  .tblw tbody td{row-gap:4px}
  .tblw tbody td.nm>*{grid-column:auto}
}
/* 리스트 상품 아이콘 (누끼 미니 무대) */
.picon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:radial-gradient(ellipse at 50% 45%,#f7faee 0,#e3eed0 60%,#c9dcae 100%);box-shadow:var(--pxbl-soft),var(--pxd-s1);overflow:hidden}
.picon img{max-width:80%;max-height:80%;object-fit:contain;display:block;filter:drop-shadow(0 3px 3px rgba(28,42,20,.18))}
.picon.em{line-height:1}
/* LIVE 카드: 좁은 폭에서 숫자·버튼 잘림 방지 */
.mini-stats .ms-v{overflow:visible;text-overflow:clip;white-space:nowrap;font-size:13.5px}
.mini-stats .ms-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btnrow.one{flex-wrap:wrap}
.btnrow.one button{flex:1 1 calc(50% - 8px);min-width:104px;padding:7px 6px;overflow:visible;text-overflow:clip}
@media(min-width:1180px){
  .btnrow.one{flex-wrap:nowrap}
  .btnrow.one button{flex:1 1 auto;min-width:0}
}
@media(max-width:1180px){
  .grid.g2 .mini-stats{grid-template-columns:1fr 1fr}
  .grid.g2 .mini-stats .ms-v{font-size:14px}
}
@media(max-width:640px){
  .btnrow.one button{flex:1 1 calc(50% - 6px);min-width:92px;font-size:11px}
  .mini-stats{grid-template-columns:1fr 1fr}
}
/* 인라인 상품 아이콘 정렬 */
.picon{vertical-align:-28%}
.hb-nm .picon,.sc-hist .picon,.rowitem .sub .picon,td .picon,h3 .picon{margin-right:4px}
.hb-nm{display:inline-flex;align-items:center;gap:2px}
h3 .picon{vertical-align:-22%}
/* --- 표 열 정렬: 아이콘+핸들 한 줄, 브랜드명 줄바꿈 금지 (2026-09-14) --- */
.who-cell{white-space:nowrap}
.who-cell .plic{vertical-align:-2px;margin-right:4px}
.who-cell .hd{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:12px}
.brd-cell{white-space:nowrap}
.tblw table th,.tblw table td{word-break:keep-all}
@media (max-width:900px){.who-cell,.brd-cell{white-space:normal}}

        .map(s=>({b,p,s,growth:growthOf(s),score:Math.round(growthOf(s)*0.6+(s.m3Sales/s.followers)/10+(s.hidden?0:5))}))

function loadLinkCtx(){
  try{
    const v=JSON.parse(localStorage.getItem(LINKCTX_KEY)||'null');
    if(!v||!v.cid)return null;

const campOrders = cid => D_().orders.filter(o=>o.campaignId===cid);
function isRefBoost(c){
  const s=seller(c.sellerId);
  if(!s||!s.referredBy)return false;
  const list=D_().campaigns.filter(x=>x.sellerId===c.sellerId&&['LIVE','CLEARING','SETTLED'].includes(x.status))
    .sort((a,b)=>a.createdAt<b.createdAt?-1:1);
  const idx=list.findIndex(x=>x.id===c.id);
  return idx>-1&&idx<REF_TIMES;
}
function isBrandRefBoost(c){
  const p=prod(c.productId);const b=p&&brand(p.brandId);
  if(!b||!b.referredBy)return false;
  const myP=D_().products.filter(x=>x.brandId===b.id).map(x=>x.id);
  const list=D_().campaigns.filter(x=>myP.includes(x.productId)&&['LIVE','CLEARING','SETTLED'].includes(x.status))
    .sort((a,b)=>a.createdAt<b.createdAt?-1:1);
  const idx=list.findIndex(x=>x.id===c.id);
  return idx>-1&&idx<BREF_TIMES;
}
function calc(c){
  const os=campOrders(c.id);
  const gross=os.filter(o=>o.status!=='CANCELED').reduce((a,o)=>a+o.unit*o.qty,0);
  const refund=os.filter(o=>o.status==='REFUNDED').reduce((a,o)=>a+o.unit*o.qty,0);
  const net=gross-refund;
  const p=prod(c.productId), s=seller(c.sellerId), b=brand(p.brandId);
  const rb=isRefBoost(c), bb=isBrandRefBoost(c);
  const sampleNet=os.filter(o=>o.sample&&o.status==='PAID').reduce((a,o)=>a+o.unit*o.qty,0);   // 인플루언서 샘플 구매분: 인플 수수료·보너스 없음
  const pg=net*PG_RATE, sf=(net-sampleNet)*p.rate;
  const gBonus=(net-sampleNet)*gradeBonusOf(s);                       // 인플루언서 등급 보너스 (플랫폼 부담)
  const boost=rb?net*REF_BOOST:0, refReward=rb?net*REF_RATE:0;
  const bBoost=bb?net*BREF_DISC:0, bReward=bb?net*BREF_RATE:0;
  const bDisc=net*bDiscOf(b);                             // 브랜드 등급 수수료 할인 (플랫폼 부담)
  const pfGross=net*PLAT_RATE;
  const costs=gBonus+boost+refReward+bBoost+bReward+bDisc;
  const pf=pfGross-costs;                                 // 플랫폼 수수료 (보상·할인 차감 후, VAT 포함)
  const vat=pf>0?pf-pf/1.1:0;                             // 수수료 매출에 내포된 부가세 10%
  const pfNet=pf-vat;                                     // 플랫폼 순수익 (PG는 브랜드 정산에서 차감 — 플랫폼 수익 아님)
  return {gross,refund,net,sampleNet,pg,sf,gBonus,sfTotal:sf+gBonus+boost,boost,refReward,rb,bb,bBoost,bReward,bDisc,pfGross,costs,pf,vat,pfNet,
    brandPay:net-pg-sf-pfGross+bBoost+bDisc,
    paidCnt:os.filter(o=>o.status==='PAID').length,refCnt:os.filter(o=>o.status==='REFUNDED').length};
}

/* 기간 정책(2026-09-14 변경): 같은 상품이라도 기간은 기본 공유(누구나 오픈 가능).
   단 플래티넘 이상 인플루언서가 확정·진행 중인 기간에는 플래티넘 이상만 새로 진입할 수 있다.
   반환: 차단 사유가 되는 상위 등급 인플루언서 객체 (없으면 null) */
const PRIORITY_TIER = '플래티넘';
function periodHolders(pid,s,e,exceptCid){
  return D_().campaigns.filter(c=>c.productId===pid&&c.id!==exceptCid
    &&['SCHEDULE_CONFIRMED','LIVE'].includes(c.status)
    &&!(P(e)<P(c.start)||P(s)>P(c.end)));
}
function isPriority(sl){return sl&&tierIdx(gname(sl))>-1&&tierIdx(gname(sl))<=tierIdx(PRIORITY_TIER);}
function periodBlock(pid,s,e,exceptCid,sellerId){
  const me=seller(sellerId);
  if(isPriority(me))return null;                       // 플래티넘 이상은 언제나 진입 가능
  const hit=periodHolders(pid,s,e,exceptCid).find(c=>isPriority(seller(c.sellerId)));
  return hit?seller(hit.sellerId):null;                // 상위 등급이 선점한 기간이면 차단
}
/* 상품 재고 배정: 확정·진행 중 캠페인에 배정된 수량 합 (제안 시 잔여 재고 초과 불가) */
function allocated(pid,exceptCid){return D_().campaigns.filter(c=>c.productId===pid&&c.id!==exceptCid&&['SCHEDULE_CONFIRMED','LIVE'].includes(c.status)).reduce((a,c)=>a+(c.qty||0),0);}
function stockLeft(p,exceptCid){return Math.max(0,(p.stock||0)-allocated(p.id,exceptCid));}

/* ---- 레트로 OS 데코: 윈도우 파일명 + 이모지 픽셀화 (스킨 전용, 데이터/기능 무관) ---- */
const PIXEL_EMOJI=false; // 2026-09-03 사용자: 픽셀화 이모지가 깨져 보임 → 원본 이모지 사용 (true로 되돌리면 픽셀아트)
function pixelizeEmoji(el){
  if(!PIXEL_EMOJI)return;
  if(!el||el.querySelector('.pxemoji')||el.querySelector('img'))return;
  const tn=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());
  if(!tn)return;
  const ch=tn.textContent.trim();
  const small=document.createElement('canvas');small.width=16;small.height=16;
  const sc=small.getContext('2d');sc.font='13px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';sc.textAlign='center';sc.textBaseline='middle';sc.fillText(ch,8,9);
  const big=document.createElement('canvas');big.width=96;big.height=96;
  const bc=big.getContext('2d');bc.imageSmoothingEnabled=false;bc.drawImage(small,0,0,96,96);
  big.className='pxemoji';big.setAttribute('aria-label',ch);
  tn.replaceWith(big);
}
function decorate(){
  document.querySelectorAll('main .sec').forEach(s=>{
    const words=s.textContent.replace(/[▶■·—]/g,' ').replace(/\d+명|\d+건/g,'').split(/\s+/)
      .map(w=>w.replace(/[^가-힣A-Za-z0-9]/g,'')).filter(w=>w&&!/^LIVE$|^진행중$/i.test(w)&&!/^@/.test(w));
    let t=words.slice(0,3).join('_'); if(t.length>12)t=words.slice(0,2).join('_'); if(t.length>12)t=words[0].slice(0,12);
    const n=s.nextElementSibling;if(!n)return;
    const targets=n.matches('.card,.listcard,.tblw,.thread')?[n]:[...n.querySelectorAll(':scope > .card, :scope > .listcard, :scope > .tblw')];
    targets.forEach(x=>{if(!x.hasAttribute('data-win'))x.setAttribute('data-win',t.toUpperCase()+'.EXE');});
  });
  document.querySelectorAll('.prod .ph, .sc-av.em, .store-em, .cust-em, .rowitem > div:first-child[style*="font-size:24px"], .det-head > div:first-child[style*="font-size:32px"]').forEach(pixelizeEmoji);
  // 반응형 표: 헤더 텍스트를 각 셀의 data-l 라벨로 (모바일에서 카드형으로 펼침)
  document.querySelectorAll('.tblw table').forEach(tb=>{
    const ths=[...tb.querySelectorAll('thead th')].map(t=>t.textContent.trim());
    if(!ths.length)return;
    tb.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{
      if(td.classList.contains('empty'))return;
      if(!td.dataset.l)td.dataset.l=ths[i]||'';
    }));
  });
}

/* ============ shared components ============ */
function stChip(st){const m=ST[st];return `<span class="st ${m.c}">${st==='LIVE'?'<span class="pulse"></span>':''}${m.l}</span>`;}
function stepper(status){
  const idx=FLOW.indexOf(status==='SAMPLE_PURCHASED'?'SAMPLE_APPROVED':status==='INVITED'?'SAMPLE_REQUESTED':status);
  return `<div class="stepper">${FLOW_L.map((l,i)=>`<span class="stp ${i<idx?'done':i===idx?'now':''}">${l}</span>`).join('')}</div>`;
}
function campRow(c,{who='seller'}={}){
  const p=prod(c.productId),b=brand(p.brandId),s=seller(c.sellerId);
  const sub = who==='seller' ? `${b.name} · 수수료 ${(p.rate*100).toFixed(0)}%` : `${platIcon(s)} ${s.name} ${s.handle} · 팔로워 ${fmt(s.followers)}`;
  const when=c.start?`<span class="sub" style="font-family:'IBM Plex Mono',monospace">${md(P(c.start))}–${md(P(c.end))}</span>`:'';
  return `<div class="rowitem" data-act="open" data-k="${c.id}">
    ${pIcon(p,38)}
    <div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">${sub}</div></div>
    ${when} ${stChip(c.status)}</div>`;
}

function prodCard(p){

  const exclLocked=p.exclusiveSellerId&&p.exclusiveSellerId!==S.actingSeller;
  return `<div class="card prod">
    <div class="ph" data-act="prodDetail" data-k="${p.id}" style="cursor:pointer;position:relative"><span class="p3d">${p.thumb?`<img src="${p.thumb}" alt="" style="max-height:92%;max-width:78%;object-fit:contain;pointer-events:none">`:p.em}</span>

      ${p.exclusive?`<span class="exclbadge">독점권 오퍼</span>`:''}</div>
    <div><span class="chip brand">${b.name}</span> <span class="gradebox sm">${gfull(bgname(b))}</span> <span class="sub" style="font-size:11px;color:var(--mute)">${p.cat}</span></div>
    <div class="nm" data-act="prodDetail" data-k="${p.id}" style="cursor:pointer">${esc(p.name)}</div>
    <div class="meta">${esc(p.desc)} · 샘플 ${p.sample}</div>
    <div class="meta" style="font-size:11px">🎁 ${sampleLine(p)}</div>
    <div class="prices"><span class="gp">₩${fmt(p.gp)}</span><span class="cp">₩${fmt(p.cp)}</span>${p.cp>p.gp?`<span class="disc">-${Math.round((1-p.gp/p.cp)*100)}%</span>`:''}<span class="rate">수수료 ${(p.rate*100).toFixed(0)}~${(p.rate*100+GRADES[0].bonus).toFixed(0)}%</span></div>
    <div class="meta">건당 예상 수수료 ₩${fmt(margin)}${exclLocked?' · <b style="color:var(--danger)">독점 인플루언서 확정 상품</b>':''}</div>
    <div class="btnrow">
      <button class="sm ghost" data-act="prodDetail" data-k="${p.id}">실적·상세</button>

/* ---- my gongu calendar ---- */
function calHtml(opt){
  opt=opt||{};
  const off=S.calOff||0;
  const base=new Date(today().getFullYear(),today().getMonth()+off,1);
  const y=base.getFullYear(),m=base.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const mine=opt.list||D_().campaigns.filter(c=>c.sellerId===S.actingSeller);
  const label=c=>opt.brandView?`${prod(c.productId).name} · ${seller(c.sellerId).name}`:prod(c.productId).name;
  const evFor=date=>{
    const t=date.getTime(),ds=ymd(date);
    const out=[];
    mine.forEach(c=>{
      if(c.start&&['SCHEDULE_CONFIRMED','LIVE','CLEARING','SETTLED'].includes(c.status)){
        const s=P(c.start).getTime(),e=P(c.end).getTime();
        if(t>=s&&t<=e)out.push({type:c.status==='LIVE'?'live':c.status==='SCHEDULE_CONFIRMED'?'plan':'done',name:label(c),first:t===s,cid:c.id});
        if(c.status==='CLEARING'&&ymd(settleDue(c))===ds)out.push({type:'pay',name:'₩ 정산 예정',first:true,cid:c.id,go:'settle'});
      }
      if(c.status==='TESTING'&&c.testDue===ds)out.push({type:'due',name:'테스트 마감',first:true,cid:c.id});
    });
    return out;
  };
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell off"></div>';
  for(let d=1;d<=dim;d++){
    const date=new Date(y,m,d);
    const evs=evFor(date);
    cells+=`<div class="cal-cell ${ymd(date)===ymd(today())?'today':''}"><span class="dn">${d}</span>
      ${evs.map(ev=>`<div class="cal-ev ${ev.type}" data-act="${ev.go?'screen':'open'}" data-k="${ev.go||ev.cid}" title="${esc(ev.name)}${ev.go?' — 정산 탭으로':''}">${ev.first?esc(ev.name):'&nbsp;'}</div>`).join('')}</div>`;
  }
  return `<div class="sec">${opt.title||'판매 캘린더 — 내 스케줄 한눈에'}</div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="cal-head">
      <button class="sm ghost" data-act="calNav" data-k="-1">‹</button>
      <b style="font-family:'Archivo',sans-serif;font-size:16px;letter-spacing:.02em">${y}.${String(m+1).padStart(2,'0')}</b>
      <button class="sm ghost" data-act="calNav" data-k="1">›</button>
      ${off!==0?`<button class="sm ghost" data-act="calNav" data-k="0">오늘</button>`:''}
      <span class="cal-legend"><span><i class="lg plan"></i>확정</span><span><i class="lg live"></i>LIVE</span><span><i class="lg done"></i>종료·정산중</span><span data-act="screen" data-k="settle" style="cursor:pointer;text-decoration:underline"><i class="lg pay"></i>정산일</span><span><i class="lg due"></i>테스트 마감</span></span>
    </div>
    <div class="cal-dow">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

       :isSeller?(already?`<button class="sm" disabled style="opacity:.6">신청 완료 — 브랜드 승인 대기</button>`

function vSales(){

    const todayOs=os.filter(o=>o.at===t&&o.status==='PAID');
    const todayRev=todayOs.reduce((a,o)=>a+o.unit*o.qty,0);
    const visits=Math.round((k.paidCnt+k.refCnt)*17.3);
    const conv=visits?((k.paidCnt+k.refCnt)/visits*100).toFixed(1):'0.0';

      return {d,rev};});
    const mx=Math.max(...days.map(x=>x.rev),1);
    const feed=os.slice(-10).reverse();
    return `<div class="sec">${esc(p.name)} · ${s.handle} <span class="st live" style="margin-left:4px"><span class="pulse"></span>진행중</span></div>
    <div class="grid g4">
      <div class="card kpi"><div class="lbl">오늘 매출</div><div class="val">₩${fmt(todayRev)}</div><div class="sub">주문 ${todayOs.length}건</div></div>
      <div class="card kpi"><div class="lbl">누적 확정 매출</div><div class="val">₩${fmt(k.net)}</div><div class="sub">결제 ${k.paidCnt}건 · 환불 ${k.refCnt}건</div></div>
      <div class="card kpi"><div class="lbl">${S.view.role==='seller'?'내 수수료 (실시간)':'브랜드 정산액 (실시간)'}</div><div class="val" style="color:var(--money)">₩${fmt(S.view.role==='seller'?k.sfTotal*(1-WHT):k.brandPay)}</div><div class="sub">${S.view.role==='seller'?'원천징수 후 예상':'수수료 차감 후 예상'}</div></div>
      <div class="card kpi"><div class="lbl">방문 → 구매 전환</div><div class="val">${conv}%</div><div class="sub">방문 ${fmt(visits)}회 (추정)</div></div>
    </div>
    <div class="livegrid" style="margin-top:16px">
      <div class="card"><h4 style="margin:0 0 4px;font-size:13px">최근 7일 매출</h4>
        <div class="barwrap"><div class="bars">${days.map(x=>`<div class="b" style="height:${Math.max(3,x.rev/mx*100)}%"><span class="bl">${x.rev?'₩'+fmt(Math.round(x.rev/1000))+'k':''}</span><span class="bd">${md(P(x.d))}</span></div>`).join('')}</div></div>
      </div>
      <div class="card" style="padding:0"><h4 style="margin:0;padding:14px 16px 8px;font-size:13px">주문 피드</h4>
        <div class="feed">${feed.map(o=>`<div class="rowitem"><div class="grow"><span style="font-weight:600">${o.buyer}</span> <span class="sub">${o.qty}개 · ${md(P(o.at))}</span></div><span class="num" style="font-family:'IBM Plex Mono',monospace">₩${fmt(o.unit*o.qty)}</span>${o.status==='REFUNDED'?'<span class="st red">환불</span>':''}</div>`).join('')||'<div class="empty">아직 주문 없음</div>'}</div>
      </div>
    </div>
    <div style="margin-top:12px"><button class="sm ghost" data-act="open" data-k="${c.id}">캠페인 상세 →</button></div>`;
  }).join('');

function brandPending(){
  const myP=D_().products.filter(p=>p.brandId===S.actingBrand).map(p=>p.id);
  const cs=D_().campaigns.filter(c=>myP.includes(c.productId)&&['SAMPLE_REQUESTED','SAMPLE_APPROVED','SAMPLE_PURCHASED','SCHEDULE_PROPOSED'].includes(c.status));
  const xr=(D_().exclusiveReqs||[]).filter(r=>myP.includes(r.productId)&&r.status==='PENDING');
  return {cs,xr,n:cs.length+xr.length};
}
function sellerPending(){
  const cs=D_().campaigns.filter(c=>c.sellerId===S.actingSeller&&['INVITED','SAMPLE_SHIPPED','TESTING','SAMPLE_APPROVED','SAMPLE_PURCHASED'].includes(c.status));
  const info=c=>c.status==='SAMPLE_APPROVED'||c.status==='SAMPLE_PURCHASED';
  return {cs,n:cs.filter(c=>!info(c)).length,info:cs.filter(info).length};
}

function pIcon(pd,sz){sz=sz||38;return pd&&pd.thumb?`<span class="picon" style="width:${sz}px;height:${sz}px"><img src="${pd.thumb}" alt=""></span>`:`<div class="picon em" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.62)}px">${pd?pd.em:'📦'}</div>`;}
function pstChip(st){const m=PSTATS()[st]||[st,'gray'];return `<span class="st ${m[1]}" style="animation:none">${m[0]}</span>`;}
function admSearch(id,val,ph,shown,total){return `<div class="dmsearch"><input id="${id}" value="${esc(val||'')}" placeholder="${ph}" oninput="ACT.${id}Live(this.value)"><span class="sub" style="color:var(--mute);font-size:12px;white-space:nowrap">${val?`${shown}/${total}건`:`전체 ${total}건`}</span>${val?`<button class="sm ghost" data-act="${id}Clear">지우기</button>`:''}</div>`;}
function admChips(list,cur,act){return `<div class="cats" style="margin:0 0 12px">${list.map(([k,l,n])=>`<button class="catchip ${cur===k?'on':''}" data-act="${act}" data-k="${k}">${l}${n!=null?` <span style="color:var(--mute);font-weight:400">${n}</span>`:''}</button>`).join('')}</div>`;}
function vAdminProducts(){

  const q=(S.admPQ||'').trim().toLowerCase();
  const base=all.filter(p=>(sf==='all'||p.status===sf)&&(bf==='all'||p.brandId===bf)&&(cf==='all'||p.cat===cf));
  const list=q?base.filter(p=>[p.name,p.desc,p.id,p.cat,brand(p.brandId).name,p.sample,(p.exclusive&&p.exclusive.label)||''].join(' ').toLowerCase().includes(q)):base;

  const gmvOf=p=>campsOf(p).reduce((a,c)=>a+calc(c).net,0);

  ${admChips([['all','전체',all.length],['pending','검수 대기',cnt('pending')],['listed','노출 중',cnt('listed')],['paused','노출 중단',cnt('paused')],['rejected','반려',cnt('rejected')]],sf,'admPS')}
  <div style="display:flex;gap:18px;flex-wrap:wrap">
    ${admChips([['all','모든 브랜드'],...D_().brands.map(b=>[b.id,b.name,all.filter(p=>p.brandId===b.id).length])],bf,'admPB')}
    ${admChips([['all','모든 카테고리'],...CATS.filter(c=>c!=='전체').map(c=>[c,c,all.filter(p=>p.cat===c).length])],cf,'admPC')}
  </div>
  ${admSearch('admPQ',S.admPQ,'상품명 · 설명 · 상품ID · 브랜드 · 카테고리 검색',list.length,base.length)}
  <div class="tblw compact"><table>
  <thead><tr><th>상품</th><th>브랜드</th><th>카테고리</th><th class="num">판매가</th><th class="num">총 수수료</th><th class="num">재고</th><th class="num">판매·매출</th><th>독점</th><th>상태</th><th>관리</th></tr></thead>
  <tbody>${list.map(p=>{const b=brand(p.brandId);const cs=campsOf(p);const live=cs.filter(c=>c.status==='LIVE').length;
    return `<tr><td class="nm"><b>${pIcon(p,24)} ${esc(p.name)}</b><div style="font-size:11.5px;color:var(--mute)">${esc(p.desc)} · ${p.id.toUpperCase()}</div></td>
    <td style="white-space:nowrap">${esc(b.name)} <span class="gradebox sm">${gfull(bgname(b))}</span></td>
    <td style="white-space:nowrap">${p.cat}</td>
    <td class="num"><b>₩${fmt(p.gp)}</b><div style="font-size:11px;color:var(--mute);text-decoration:line-through">₩${fmt(p.cp)}</div></td>
    <td class="num">${totalRate(p)}%<div style="font-size:11px;color:var(--mute)">인플 ${(p.rate*100).toFixed(0)} + 플랫폼 ${(PLAT_RATE*100).toFixed(0)}</div></td>
    <td class="num">${fmt(p.stock)}</td>
    <td class="num">${cs.length}건${live?` <span class="st live" style="animation:none">LIVE ${live}</span>`:''}<div style="font-size:11px;color:var(--mute)">₩${fmt(gmvOf(p))}</div></td>
    <td style="white-space:nowrap">${p.exclusive?`<span class="gradebox sm">${gfull(exGradeOf(p))}</span>${p.exclusiveSellerId?' <span class="st green" style="animation:none">확정</span>':''}`:'<span style="color:var(--mute)">—</span>'}</td>
    <td>${pstChip(p.status)}</td>
    <td><div style="display:flex;gap:4px;flex-wrap:wrap">${p.status==='rejected'?`<span class="sub" style="font-size:11px;color:var(--mute)">${esc(p.rejectReason||'')}</span><button class="sm ghost" data-act="approveProduct" data-k="${p.id}">승인으로 변경</button>`:p.status==='pending'?`<button class="sm pri" data-act="approveProduct" data-k="${p.id}">승인</button><button class="sm danger" data-act="rejectProduct" data-k="${p.id}">반려</button>`
      :`<button class="sm ghost" data-act="toggleListing" data-k="${p.id}">${p.status==='listed'?'노출 중단':'재개'}</button>`}
      <button class="sm ghost" data-act="prodDetail" data-k="${p.id}">실적</button><button class="sm ghost" data-act="previewProduct" data-k="${p.id}">상세페이지</button></div></td></tr>`;}).join('')||`<tr><td colspan="10" class="empty">${S.admPQ?`"${esc(S.admPQ)}"에 맞는 상품이 없습니다`:'조건에 맞는 상품이 없습니다'}</td></tr>`}
  </tbody></table></div>`;
}

function storeCamp(cid){
  if(typeof cid==='string'&&cid.startsWith('p:')){const pid=cid.slice(2),p=prod(pid);if(!p)return null;
    const sid=S.view.role==='seller'?S.actingSeller:(D_().campaigns.find(c=>c.productId===pid)||{}).sellerId||D_().sellers.find(x=>!x.hidden).id;
    return {id:cid,productId:pid,sellerId:sid,status:'PREVIEW',qty:p.stock||0,preview:true};}
  return camp(cid);
}

      <div class="msgs">${msgs.map(m=>{
